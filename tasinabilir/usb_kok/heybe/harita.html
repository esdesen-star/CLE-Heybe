<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heybe · Harita</title>
<!-- 09.11.2026 (harita 8i): çevrim dışı harita ve rota. Her şey bellekten: harita görüntüsü (PMTiles), yazılar,
     simgeler, rota ve arama yardımcıdan gelir; internet istenmez. Rotayı algoritma hesaplar, dil modeli değil. -->
<link rel="stylesheet" href="harita_kit/maplibre-gl.css">
<style>
  [hidden] { display: none !important; }   /* 13.11: .haritaSecSatir'ın flex'i gizlemeyi eziyordu, tek haritada boş seçim kutusu */
  :root { --zemin: #f6f1e7; --yazi: #2b2118; --soluk: #6b5d4f; --kart: #fffaf2; --cizgi: #d9cbb4;
          --vurgu: #8a3b12; --uyari: #9a6a00; --dur: #a02c1c; --tamam: #2f6b3a; }
  @media (prefers-color-scheme: dark) {
    :root { --zemin: #1d1915; --yazi: #efe6d8; --soluk: #b3a593; --kart: #27221c; --cizgi: #4a4035;
            --vurgu: #e08a5a; --uyari: #e0b44a; --dur: #f07a68; --tamam: #7cc48a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* 09.11 (§80): panel uzayınca harita da pencereden uzun oluyordu (768 px pencerede 2.088 px) ve "görünen alan"
     çok büyük çıkıyordu. Masaüstü: harita pencere boyunda sabit; panel ve tarif kendi içinde kayar. */
  body { margin: 0; background: var(--zemin); color: var(--yazi); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; grid-template-columns: 380px 1fr; grid-template-rows: minmax(0, 1fr) auto; height: 100vh; overflow: hidden; }
  #panel { grid-column: 1; grid-row: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 0; border-inline-end: 1px solid var(--cizgi); }
  #sonuc { grid-column: 1; grid-row: 2; max-height: 45vh; overflow-y: auto; padding: 0 16px 16px; border-inline-end: 1px solid var(--cizgi); }
  #harita { grid-column: 2; grid-row: 1 / 3; min-height: 0; }
  /* Telefon: arama, harita, tarif alt alta; sayfa kayar, harita sabit yükseklikte */
  @media (max-width: 760px) {
    body { display: block; height: auto; overflow: visible; }
    #panel, #sonuc { border: 0; overflow: visible; max-height: none; }
    #harita { height: 60vh; border-block: 1px solid var(--cizgi); }
    #sonuc { padding-top: 4px; }
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { margin: 0; font-size: 24px; }
  a { color: var(--vurgu); }
  .not { background: var(--kart); border: 1px dashed var(--uyari); color: var(--uyari); border-radius: 12px;
         padding: 10px 12px; margin: 12px 0; font-size: 14px; }
  .alan { position: relative; margin-top: 12px; }
  .alan label { display: block; font-size: 14px; color: var(--soluk); margin-bottom: 4px; }
  .satir { display: flex; gap: 6px; }
  input[type=search] { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--cizgi);
                       border-radius: 10px; background: var(--kart); color: inherit; }
  button { font: inherit; padding: 10px 14px; border: 0; border-radius: 10px; background: var(--vurgu); color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.ince { padding: 6px 10px; font-size: 14px; background: transparent; color: var(--vurgu); border: 1px solid var(--cizgi); }
  button.ince:hover, button.ince:focus { border-color: var(--vurgu); }
  ul.oneri { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--cizgi); border-radius: 10px;
             background: var(--kart); max-height: 260px; overflow-y: auto; }
  ul.oneri:empty { display: none; }
  ul.oneri li button { display: block; width: 100%; text-align: start; background: transparent; color: var(--yazi);
                       border-radius: 0; padding: 8px 10px; font-size: 15px; }
  ul.oneri li button:hover, ul.oneri li button:focus { background: var(--zemin); outline: none; }
  ul.oneri small { color: var(--soluk); display: block; font-size: 13px; }
  .kip { display: flex; gap: 14px; margin-top: 12px; }
  .kip label { display: flex; gap: 6px; align-items: center; }
  .yakin { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; font-size: 14px; color: var(--soluk); }
  #durum { margin-top: 12px; min-height: 1.5em; color: var(--soluk); font-size: 15px; }
  #durum.hata { color: var(--dur); }
  #ozet { font-size: 18px; font-weight: 600; margin-top: 8px; }
  #sureNot { margin: 2px 0 0; font-size: 13px; color: var(--soluk); }
  #sureNot:empty { display: none; }
  ol#adimlar { padding-inline-start: 22px; margin: 8px 0 0; font-size: 15px; }
  ol#adimlar li { margin: 4px 0; }
  ol#adimlar span { color: var(--soluk); }
  .maplibregl-popup-content { color: #2b2118; font: 14px/1.4 system-ui, sans-serif; }
  .maplibregl-popup-content button { margin: 4px 4px 0 0; padding: 6px 10px; font-size: 14px; }
  .maplibregl-popup-content button.kapat { color: #b3261e; border-color: #b3261e; } /* 12.11 (8f2): yolu kapat */
  .bos { padding: 24px; }
  #ekKutu { margin: 14px 0 16px; border-top: 1px solid var(--cizgi); padding-top: 10px; }
  #ekKutu summary { cursor: pointer; color: var(--vurgu); font-size: 15px; }
  .ekNot { font-size: 14px; color: var(--soluk); margin: 8px 0; }
  .dosyaSec { display: inline-block; font-size: 14px; }
  .dosyaSec input { display: block; margin-top: 4px; font: inherit; font-size: 14px; max-width: 100%; }
  #ekDurum { font-size: 14px; color: var(--soluk); min-height: 1.2em; }
  #ekDurum.hata { color: var(--dur); }
  #ekListe { list-style: none; padding: 0; margin: 6px 0 0; font-size: 14px; }
  #ekListe li { padding: 6px 0; border-bottom: 1px solid var(--cizgi); }
  #ekListe small { display: block; color: var(--soluk); }
  #ekListe button { margin-top: 4px; }
  .ekBagSatir { margin-top: 10px; }
  .ekBagSatir input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--cizgi);
                      border-radius: 10px; background: var(--kart); color: inherit; }
  .haritaSecSatir { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; color: var(--soluk); }
  .haritaSecSatir select { font: inherit; font-size: 14px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--cizgi);
                           background: var(--kart); color: var(--yazi); }
  #indirKutu { margin: 0 0 16px; border-top: 1px solid var(--cizgi); padding-top: 10px; }
  #indirKutu summary { cursor: pointer; color: var(--vurgu); font-size: 15px; }
  #bolgeAra { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--cizgi); border-radius: 10px; background: var(--kart); color: inherit; }
  #teklif { font-size: 14px; margin-top: 8px; }
  #teklif p { margin: 4px 0; }
  #teklif .kotu { color: var(--dur); }
  #indirDurum { font-size: 14px; color: var(--soluk); min-height: 1.2em; }
  #indirDurum.hata { color: var(--dur); }
  .noktaForm { display: grid; gap: 6px; margin-top: 6px; }
  #indirKutu h3 { font-size: 15px; margin: 16px 0 4px; }
  #alanSatir input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--cizgi);
                     border-radius: 10px; background: var(--kart); color: inherit; }
  #dosyaDurum { font-size: 14px; color: var(--soluk); min-height: 1.2em; }
  #dosyaDurum.hata { color: var(--dur); }
  #haritaListe { list-style: none; padding: 0; margin: 4px 0 0; font-size: 14px; }
  #haritaListe li { padding: 6px 0; border-bottom: 1px solid var(--cizgi); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  #haritaListe small { color: var(--soluk); }
  .noktaForm select, .noktaForm input { font: inherit; font-size: 14px; padding: 4px 6px; }
</style>
</head>
<body>
<section id="panel">
  <header><h1 data-m="baslik"></h1><a href="/" data-m="geri"></a></header>
  <label class="haritaSecSatir" id="haritaSecSatir" hidden><span data-m="haritaSecEtiket"></span> <select id="haritaSec"></select></label>
  <p class="not" id="uyari" role="note"></p>
  <div class="alan">
    <label for="nereden" data-m="nereden"></label>
    <div class="satir">
      <input type="search" id="nereden" autocomplete="off" aria-controls="neredenOneri">
      <button type="button" class="ince" id="konumum" data-m="konumum"></button>
    </div>
    <ul class="oneri" id="neredenOneri"></ul>
  </div>
  <div class="alan">
    <label for="nereye" data-m="nereye"></label>
    <div class="satir"><input type="search" id="nereye" autocomplete="off" aria-controls="nereyeOneri"></div>
    <ul class="oneri" id="nereyeOneri"></ul>
  </div>
  <div class="kip" role="radiogroup">
    <label><input type="radio" name="kip" value="yaya" checked> <span data-m="yaya"></span></label>
    <label><input type="radio" name="kip" value="arac"> <span data-m="arac"></span></label>
  </div>
  <div class="yakin"><span data-m="enYakin"></span>
    <button type="button" class="ince" data-tur="hastane"></button>
    <button type="button" class="ince" data-tur="toplanma"></button>
    <button type="button" class="ince" data-tur="eczane"></button>
    <button type="button" class="ince" data-tur="su"></button>
    <button type="button" class="ince" data-tur="barinak"></button>
    <button type="button" class="ince" data-tur="dagitim"></button>
  </div>
  <p id="durum" role="status" aria-live="polite"></p>
  <ul class="oneri" id="yakinListe"></ul>
  <!-- 09.11 (§77, K18): kurumun kendi noktaları — Excel, CSV, KML, GeoJSON; bellekte harita/ek/ klasörüne -->
  <details id="ekKutu">
    <summary data-m="ekBaslik"></summary>
    <p class="ekNot" data-m="ekAciklama"></p>
    <label class="dosyaSec"><span data-m="ekSec"></span>
      <input type="file" id="ekDosya" accept=".xlsx,.csv,.txt,.tsv,.kml,.kmz,.geojson,.json"></label>
    <div class="satir ekBagSatir"><input type="url" id="ekBag" autocomplete="off" inputmode="url">
      <button type="button" class="ince" id="ekBagEkle" data-m="ekBagEkle"></button></div>
    <p class="ekNot" data-m="ekBagNot"></p>
    <p id="ekDurum" role="status" aria-live="polite"></p>
    <ul id="ekListe"></ul>
  </details>
  <!-- 09.11 (§78): bölge haritası indirme — internet varken, kullanıcı onaylayınca -->
  <details id="indirKutu">
    <summary data-m="indirBaslik"></summary>
    <p class="ekNot" data-m="indirAciklama"></p>
    <input type="search" id="bolgeAra" autocomplete="off">
    <ul class="oneri" id="bolgeListe"></ul>
    <div id="alanKutu">
      <h3 data-m="alanBaslik"></h3>
      <p class="ekNot" id="alanAciklama"></p>
      <div class="satir" id="alanSatir"><input type="text" id="alanAdi" maxlength="60" autocomplete="off">
        <button type="button" class="ince" id="alanIndir" data-m="alanIndir"></button></div>
    </div>
    <div id="teklif"></div>
    <p id="indirDurum" role="status" aria-live="polite"></p>
    <button type="button" class="ince" id="indirDur" data-m="indirDurdur" hidden></button>
    <h3 data-m="dosyaBaslik"></h3>
    <p class="ekNot" data-m="dosyaAciklama"></p>
    <label class="dosyaSec"><span data-m="ekSec"></span>
      <input type="file" id="haritaDosya" multiple accept=".pmtiles,.rota,.yer,.json,.pbf"></label>
    <p id="dosyaDurum" role="status" aria-live="polite"></p>
    <h3 data-m="haritalarBaslik"></h3>
    <ul id="haritaListe"></ul>
  </details>
</section>
<div id="harita" role="application" aria-label="Harita"></div>
<section id="sonuc">
  <div id="ozet"></div>
  <p id="sureNot"></p>
  <ol id="adimlar"></ol>
</section>

<script src="harita_kit/pmtiles.js"></script>
<script src="harita_kit/basemaps.js"></script>
<script src="harita_metin_ek.js"></script><!-- 13.11 (§123): öbür dillerin ekran yazıları, makine çevirisi -->

// metinKur'unun aynısı (sayfa.html) — harita ayrı bir sayfa olduğu için burada da var.
function metinKur(taban, ek) {
  const o = {};
  for (const [k, v] of Object.entries(taban)) {
    const e = ek ? ek[k] : undefined;
    if (typeof v === 'function') o[k] = typeof e === 'string' ? (...a) => e.replace(/\{(\d)\}/g, (x, i) => a[i] ?? '') : v;
    else if (v && typeof v === 'object') o[k] = metinKur(v, e);
    else o[k] = typeof e === 'string' && e ? e : v;
  }
  return o;
}

function makineDuzelt(M, dil) {

// 12.11 (8f2, LM 10.11): kullanıcının kapattığı yollar — afetten sonra yıkılan yol, çöken köprü. Rota oradan geçmez
// (yaya da araç da). Kayıt bu Heybe'de, harita adına göre (harita/kapali.json); kırmızı kesik çizgi, dokununca açılır.
async function kapaliIste(yontem, govde, id) {
  const y = await fetch(`/api/kapali?${id ? 'id=' + encodeURIComponent(id) : ''}${HARITA}`, { method: yontem, cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'X-Heybe': '1' }, body: govde ? JSON.stringify(govde) : undefined }).catch(() => null);
  if (!y) return null;
  const r = await y.json().catch(() => null);
  if (r && r.kapali) kapaliCiz(r.kapali);
  return r;
}
let sonRota = null;   // çizili rotanın çizgisi [[lon, lat], …] (rotayaCek için)
function rotayaCek(nokta, lat, lon) {
  if (!sonRota || sonRota.length < 2) return [lat, lon];
  let en = Infinity, enN = null;
  let onceki = harita.project(sonRota[0]);
  for (let i = 1; i < sonRota.length; i++) {
    const simdi = harita.project(sonRota[i]);
    const dx = simdi.x - onceki.x, dy = simdi.y - onceki.y, l = dx * dx + dy * dy;
    const t = l ? Math.max(0, Math.min(1, ((nokta.x - onceki.x) * dx + (nokta.y - onceki.y) * dy) / l)) : 0;
    const x = onceki.x + t * dx, y = onceki.y + t * dy, d = Math.hypot(nokta.x - x, nokta.y - y);
    if (d < en) { en = d; enN = [x, y]; }
    onceki = simdi;
  }
  if (en > 12) return [lat, lon];
  const ll = harita.unproject(enN);
  return [ll.lat, ll.lng];
}
async function kapaliCiz(liste) {

    properties: { id: k.id, ad: k.ad || M.sinif[k.tur] || M.adsiz, tarih: k.tarih }, geometry: { type: 'LineString', coordinates: k.geo } })) };
  const kaynak = harita.getSource('kapali');
  if (kaynak) { kaynak.setData(veri); return; }
  harita.addSource('kapali', { type: 'geojson', data: veri });
  harita.addLayer({ id: 'kapali-kenar', type: 'line', source: 'kapali', layout: { 'line-cap': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': 10 } });
  harita.addLayer({ id: 'kapali', type: 'line', source: 'kapali', paint: { 'line-color': '#b3261e', 'line-width': 6, 'line-dasharray': [1.2, 0.8] } });
}

}

document.querySelectorAll('input[name=kip]').forEach((r) => r.addEventListener('change', () => { if (nokta.bas && nokta.son) rotaBul(); }));
const kip = () => document.querySelector('input[name=kip]:checked').value;

// 12.11 (8i-5): sohbetten gelen yol sorusu — ?yakin=hastane (başlangıç seçilince en yakınlar) · ?nereye=Samandağ (arama kutusu dolar)

// Kurumun listesi (09.11, §77): yükle, listele, kaldır; noktalar haritada daire olarak.
const ekRenk = ['match', ['get', 'tur'], 'toplanma', '#2f6b3a', 'su', '#1f6fb2', 'barinak', '#c2681b', 'hastane', '#a02c1c',
                'saglik', '#a02c1c', 'eczane', '#0f7c7c', 'dagitim', '#6b3fa0', '#6b5d4f'];
async function ekNoktalariCiz() {
  await haritaHazir;
  let veri;
  try { veri = await (await fetch('/api/harita-ek-geo', { cache: 'no-store' })).json(); } catch (e) { return; }
  const kaynak = harita.getSource('ek');
  if (kaynak) { kaynak.setData(veri); return; }
  harita.addSource('ek', { type: 'geojson', data: veri });
  harita.addLayer({ id: 'ek', type: 'circle', source: 'ek',
    paint: { 'circle-color': ekRenk, 'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 3, 14, 7],
             'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1.5 } });
  harita.on('click', 'ek', (e) => {
    e.preventDefault();
    const o = e.features[0].properties, [lon, lat] = e.features[0].geometry.coordinates;
    const kutu = document.createElement('div');
    const b = document.createElement('strong'); b.textContent = o.ad || M.tur[o.tur] || o.tur;
    const a = document.createElement('div'); a.textContent = [M.tur[o.tur] || o.tur, o.baglam, M.liste(o.liste)].filter(Boolean).join(' · ');
    const b1 = document.createElement('button'); b1.type = 'button'; b1.textContent = M.buradanBasla;
    const b2 = document.createElement('button'); b2.type = 'button'; b2.textContent = M.burayaGit;
    kutu.append(b, a, b1, b2);
    const p = new maplibregl.Popup().setLngLat([lon, lat]).setDOMContent(kutu).addTo(harita);
    const ad = o.ad || M.tur[o.tur] || o.tur;
    b1.addEventListener('click', () => { p.remove(); noktaKoy('bas', lat, lon, ad); });
    b2.addEventListener('click', () => { p.remove(); noktaKoy('son', lat, lon, ad); });
  });
  harita.on('mouseenter', 'ek', () => { harita.getCanvas().style.cursor = 'pointer'; });
  harita.on('mouseleave', 'ek', () => { harita.getCanvas().style.cursor = ''; });
}
function ekUyariMetni(u) {
  const i = u.indexOf(':'), k = i < 0 ? u : u.slice(0, i), v = i < 0 ? '' : u.slice(i + 1);
  return M.ekUyari[k] ? M.ekUyari[k](v) : (M.ekHata[k] || u);
}
async function ekListeYaz() {

  ul.replaceChildren();
  for (const l of r.listeler || []) {

    li.textContent = `${l.dosya} — ${M.ekNokta(l.nokta)}${turler ? ' (' + turler + ')' : ''}`;
    for (const u of l.uyarilar || []) { const s = document.createElement('small'); s.textContent = ekUyariMetni(u); li.append(s); }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ince'; b.textContent = M.ekKaldir;
    b.addEventListener('click', async () => {
      if (!confirm(M.ekKaldirSor(l.dosya))) return;
      await fetch('/api/harita-ek-sil', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Heybe': '1' }, body: JSON.stringify({ dosya: l.dosya }) });
      ekListeYaz(); ekNoktalariCiz();
    });
    li.append(b);
    ul.append(li);
  }
  if ((r.listeler || []).length) $('ekKutu').open = true;
}
$('ekDosya').addEventListener('change', async () => {

});

// Harita indirme (09.11, §78): bölge ara → boyut teklifi → onayla → ilerleme. Sayfa yenilense de iş sürer.
function indirKur() {
  $('bolgeAra').placeholder = M.bolgeAra;
  let bolgeler = null;
  const ozel = [{ id: 'dunya-genel', goster: M.dunyaGenel, ara: '' }, { id: 'dunya-tam', goster: M.dunyaTam, ara: '' }];
  const kucult = (x) => (x || '').toLocaleLowerCase(dil).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i');
  async function katalogYukle() {
    if (bolgeler) return;
    $('indirDurum').className = ''; $('indirDurum').textContent = M.katalogAliniyor;
    const y = await fetch('/api/harita-katalog').catch(() => null);
    const r = y ? await y.json().catch(() => ({})) : { hata: 'internet-yok' };
    if (!y || !y.ok) { $('indirDurum').className = 'hata'; $('indirDurum').textContent = M.indirHata[r.hata] || M.hata; return; }
    const adlar = Object.fromEntries(r.bolgeler.map((b) => [b.id, b]));
    const isim = (b) => (b.iso && bolgeAdi ? bolgeAdi.of(b.iso) : '') || M.kita[b.id] || b.ad;
    bolgeler = r.bolgeler.map((b) => ({ id: b.id, goster: isim(b) + (b.ust && adlar[b.ust] ? ' · ' + isim(adlar[b.ust]) : ''),
                                         ara: kucult(isim(b) + ' ' + b.ad + ' ' + b.id) }));
    $('indirDurum').textContent = '';
    listele();
  }
  function listele() {
    const q = kucult($('bolgeAra').value.trim());
    const ul = $('bolgeListe');
    ul.replaceChildren();
    const uyan = q ? (bolgeler || []).filter((b) => b.ara.split(/\s+/).some((w) => w.startsWith(q)) || b.ara.includes(q)).slice(0, 25) : [];
    for (const b of (q ? [] : ozel).concat(uyan)) {
      const li = document.createElement('li');
      const d = document.createElement('button'); d.type = 'button'; d.textContent = b.goster;
      d.addEventListener('click', () => { ul.replaceChildren(); $('bolgeAra').value = b.goster; teklifAl({ bolge: b.id }); });
      li.append(d); ul.append(li);
    }
  }
  $('indirKutu').addEventListener('toggle', () => { if ($('indirKutu').open) { katalogYukle(); listele(); } });
  $('bolgeAra').addEventListener('input', () => { katalogYukle(); listele(); });
  async function teklifAl(govde) {
    const tk = $('teklif'); tk.replaceChildren();
    $('indirDurum').className = ''; $('indirDurum').textContent = M.hesaplaniyor;
    const y = await fetch('/api/harita-indir', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Heybe': '1' }, body: JSON.stringify(govde) }).catch(() => null);
    const t = y ? await y.json().catch(() => ({})) : { hata: 'internet-yok' };
    if (!y || !y.ok) { $('indirDurum').className = 'hata'; $('indirDurum').textContent = M.indirHata[t.hata] || M.hata; return; }
    $('indirDurum').textContent = '';
    const satir = (m, kotu) => { const p = document.createElement('p'); p.textContent = m; if (kotu) p.className = 'kotu'; tk.append(p); };
    satir((t.ayrintiDusuk ? M.teklifHaritaBuyuk : M.teklifHarita)(boyut(t.haritaMB)));
    const yolBolge = t.yolIso && bolgeAdi ? (bolgeAdi.of(t.yolIso) || t.yolKaynak) : t.yolKaynak;
    satir(!t.yolVar ? M.teklifYolYok : t.alan ? M.teklifAlanYol(yolBolge, boyut(t.yolMB), sayi.format(t.bellekGB)) : M.teklifYol(boyut(t.yolMB), sayi.format(t.bellekGB)));
    satir(M.teklifDisk(sayi.format(t.gerekGB), sayi.format(t.bosGB)));
    if (!t.sigar) satir(M.teklifYerYok, true);
    if (t.buyukDosyaSorunu) satir(M.teklifFat, true);
    const b = document.createElement('button'); b.type = 'button'; b.textContent = M.indirDugme; b.disabled = !t.sigar || t.buyukDosyaSorunu;
    b.addEventListener('click', async () => {
      b.disabled = true;
      const y2 = await fetch('/api/harita-indir', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Heybe': '1' }, body: JSON.stringify({ ...govde, onay: true }) }).catch(() => null);
      const r2 = y2 ? await y2.json().catch(() => ({})) : { hata: 'internet-yok' };
      if (!y2 || !y2.ok) { $('indirDurum').className = 'hata'; $('indirDurum').textContent = M.indirHata[r2.hata] || M.hata; b.disabled = false; return; }
      tk.replaceChildren(); izle();
    });
    tk.append(b);
  }
  $('indirDur').addEventListener('click', () => fetch('/api/harita-indir-dur', { method: 'POST', headers: { 'X-Heybe': '1' } }));
  // Haritada görünen alan (09.11, §80): harita varsa
  $('alanAdi').placeholder = M.alanAdi;
  if (bilgi.var) {
    $('alanAciklama').textContent = M.alanAciklama;
    $('alanIndir').addEventListener('click', () => {
      const isim = $('alanAdi').value.trim();
      if (!isim) { $('indirDurum').className = 'hata'; $('indirDurum').textContent = M.alanAdGerek; $('alanAdi').focus(); return; }
      const s = harita.getBounds();
      const kutu = [Math.max(-180, s.getWest()), Math.max(-85, s.getSouth()), Math.min(180, s.getEast()), Math.min(85, s.getNorth())].map((v) => Math.round(v * 1e5) / 1e5);
      teklifAl({ kutu, isim });
    });
  } else {
    $('alanAciklama').textContent = M.alanIpucu;
    $('alanSatir').hidden = true;
  }
  // Dosyadan harita ekle: büyük dosya belleğe alınmadan gönderilir; ilerleme XHR'den
  $('haritaDosya').addEventListener('change', async () => {
    const d = $('dosyaDurum');
    const dosyalar = [...$('haritaDosya').files];
    let pbfVar = false;
    for (const f of dosyalar) {
      d.className = '';
      const sonuc = await new Promise((tamam) => {
        const x = new XMLHttpRequest();
        x.open('POST', '/api/harita-dosya?ad=' + encodeURIComponent(f.name));
        x.setRequestHeader('X-Heybe', '1');
        x.upload.onprogress = (e) => { if (e.lengthComputable) d.textContent = M.dosyaYukleniyor(f.name, Math.floor(e.loaded / e.total * 100)); };
        x.onload = () => { let r = {}; try { r = JSON.parse(x.responseText); } catch (e) {} tamam({ ok: x.status === 200, r }); };
        x.onerror = () => tamam({ ok: false, r: {} });
        x.send(f);
      });
      if (!sonuc.ok) { d.className = 'hata'; d.textContent = `${f.name}: ${M.dosyaHata[sonuc.r.hata] || M.hata}`; break; }
      if (sonuc.r.hazirlik) pbfVar = true;
      d.textContent = M.dosyaEklendi(f.name);
    }
    $('haritaDosya').value = '';
    haritaListeYaz(true); // reddedilen dosya olsa da eklenenler listede görünsün
    if (pbfVar) izle();
  });
  haritaListeYaz(false);
  async function izle() {
    const r = await fetch('/api/harita-indir', { cache: 'no-store' }).then((y) => y.json()).catch(() => ({}));
    const d = $('indirDurum');
    if (!r.asama) return;
    $('indirKutu').open = true;
    const suruyor = ['harita', 'yol', 'hazirlik'].includes(r.asama);
    $('indirDur').hidden = !suruyor;
    d.className = r.asama === 'hata' ? 'hata' : '';
    let m = M.asama[r.asama] || r.asama;
    if (suruyor && r.toplam) m += ` — %${Math.floor((r.oran || 0) * 100)} (${boyut(r.inen / 1e6)} / ${boyut(r.toplam / 1e6)})`;
    else if (suruyor) m += ` — %${Math.floor((r.oran || 0) * 100)}`;
    if (r.asama === 'hata') m += ' ' + (M.indirHata[r.hata] || r.hata);
    d.textContent = m;
    if (r.asama === 'bitti' && !d.querySelector('a')) {
      haritaListeYaz(true);
      const a = document.createElement('a'); a.href = `?dil=${dil}&harita=${encodeURIComponent(r.ad)}`; a.textContent = ' ' + M.yeniHaritaAc;
      d.append(a);
    }
    if (suruyor) setTimeout(izle, 2000);
  }
  izle();
}

// Bu Heybe'deki haritalar: ad, yol tarifi var mı, kaldır (09.11, §80)
async function haritaListeYaz(yeni) {
  const r = yeni ? await fetch('/api/harita', { cache: 'no-store' }).then((y) => y.json()).catch(() => bilgi) : bilgi;
  const ul = $('haritaListe');
  ul.replaceChildren();
  for (const h of r.haritalar || []) {
    const li = document.createElement('li');
    const a = document.createElement('a'); a.href = `?dil=${dil}&harita=${encodeURIComponent(h.ad)}`; a.textContent = haritaIsmi(h);
    const s = document.createElement('small'); s.textContent = ' · ' + (h.yol ? M.yolVarKisa : M.yolYokKisa);
    const sol = document.createElement('span'); sol.append(a, s);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ince'; b.textContent = M.haritaKaldir;
    b.addEventListener('click', async () => {
      if (!confirm(M.haritaKaldirSor(haritaIsmi(h)))) return;
      await fetch('/api/harita-sil', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Heybe': '1' }, body: JSON.stringify({ ad: h.ad }) });
      location.search = `?dil=${dil}`;
    });
    li.append(sol, b);
    ul.append(li);
  }
}

async function rotaBul(yerinde = false) {   // yerinde: harita rotaya sığdırılmaz (yol kapatınca kullanıcı neyi kapattığını görsün)
  durum(M.hesap);
  $('ozet').textContent = '';
  $('sureNot').textContent = '';
  $('adimlar').replaceChildren();
  let r;
  const uzun = setTimeout(() => durum(M.agYukleniyor), 2000); // ilk rota yol ağının yüklenmesini bekler
  try {
    r = await (await fetch(`/api/rota?a=${nokta.bas.lat},${nokta.bas.lon}&b=${nokta.son.lat},${nokta.son.lon}&kip=${kip()}${HARITA}`)).json();
  } catch (e) { clearTimeout(uzun); durum(M.hata, true); return; }
  clearTimeout(uzun);
  if (r.hata === 'harita-yok') { durum(M.yolYokHarita, true); cizgi(null); return r; }
  if (!r.tamam) { durum(r.hata === 'yol-yok' ? M.yolYok : r.kapali ? M.rotaYokKapali : (kip() === 'yaya' ? M.rotaYokYaya : M.rotaYok), true); cizgi(null); return r; }
  const notlar = [];
  if (r.kapali) notlar.push(kapaliYazi(r.kapali));
  if (r.kuralsizRota) notlar.push(M.kuralsiz);   // 13.11: dönüş yasaklarıyla yol çıkmadı
  if (r.basSapma > 150) notlar.push(M.sapma(uzunluk(r.basSapma)));
  if (r.varSapma > 150) notlar.push(M.sapma(uzunluk(r.varSapma)));
  durum(notlar.join(' '));
  $('ozet').textContent = (kip() === 'arac' ? M.ozetArac : M.ozetYaya)(uzunluk(r.m), sure(r.sn));
  $('sureNot').textContent = M.sureNot;
  for (const a of r.adimlar) {
    const li = document.createElement('li');
    const ad = a.ad || M.sinif[a.tur] || M.adsiz;
    li.textContent = `${YON_OK[a.yon] ? YON_OK[a.yon] + ' ' : ''}${M.yon[a.yon] || a.yon}${ad ? M.boyunca(ad) : ''}${a.tur === 24 ? M.vapurNot : ''} `;
    const s = document.createElement('span'); s.textContent = uzunluk(a.m);
    li.append(s);
    $('adimlar').append(li);
  }
  const son = document.createElement('li'); son.textContent = M.varis; $('adimlar').append(son);
  cizgi(r.geo, yerinde);
  return r;
}

async function cizgi(geo, yerinde = false) {
  await haritaHazir; // rota haritanın stili yüklenmeden gelirse beklenir
  sonRota = geo;
  const veri = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: geo || [] } };
  const kaynak = harita.getSource('rota');
  if (kaynak) kaynak.setData(veri);
  else {
    harita.addSource('rota', { type: 'geojson', data: veri });
    const alti = harita.getLayer('kapali-kenar') ? 'kapali-kenar' : undefined;   // kapalı yol rotanın üstünde görünsün
    harita.addLayer({ id: 'rota-kenar', type: 'line', source: 'rota', layout: { 'line-join': 'round', 'line-cap': 'round' },
                      paint: { 'line-color': '#ffffff', 'line-width': 9 } }, alti);
    harita.addLayer({ id: 'rota', type: 'line', source: 'rota', layout: { 'line-join': 'round', 'line-cap': 'round' },
                      paint: { 'line-color': '#8a3b12', 'line-width': 5 } }, alti);
  }
  if (geo && geo.length > 1 && !yerinde) {
    const b = geo.reduce((k, p) => k.extend(p), new maplibregl.LngLatBounds(geo[0], geo[0]));
    harita.fitBounds(b, { padding: 50, maxZoom: 16 });
  }
}
