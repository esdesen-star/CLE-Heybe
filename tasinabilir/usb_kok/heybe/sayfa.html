<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLE Heybe</title>
<style>
  :root { --zemin: #f6f1e7; --yazi: #2b2118; --soluk: #6b5d4f; --kart: #fffaf2; --cizgi: #d9cbb4;
          --vurgu: #8a3b12; --uyari: #9a6a00; --dur: #a02c1c; --tamam: #2f6b3a; }
  @media (prefers-color-scheme: dark) {
    :root { --zemin: #1d1915; --yazi: #efe6d8; --soluk: #b3a593; --kart: #27221c; --cizgi: #4a4035;
            --vurgu: #e08a5a; --uyari: #e0b44a; --dur: #f07a68; --tamam: #7cc48a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--zemin); color: var(--yazi); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 780px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
  .alt { color: var(--soluk); margin: 2px 0 22px; }
  .diller { display: grid; gap: 12px; margin-top: 8px; }
  .diller button { font-size: 22px; padding: 16px 20px; text-align: left; background: var(--kart); color: var(--yazi);
                   border: 1px solid var(--cizgi); }
  .diller button:hover, .diller button:focus { border-color: var(--vurgu); outline: none; }
  .diller button span { display: block; font-size: 14px; color: var(--soluk); }
  .diller.ek { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .diller.ek button { font-size: 16px; padding: 10px 12px; }
  p.ekNot { margin-top: 28px; font-size: 14px; color: var(--soluk); }
  form.satir, #form { display: flex; gap: 8px; }
  input[type=text], textarea, select { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border: 1px solid var(--cizgi);
                     border-radius: 12px; background: var(--kart); color: inherit; }
  select { flex: 0 0 auto; }
  textarea { resize: vertical; }
  button { font: inherit; padding: 12px 18px; border: 0; border-radius: 12px; background: var(--vurgu); color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.ince { padding: 6px 12px; font-size: 15px; background: transparent; color: var(--vurgu); border: 1px solid var(--cizgi); }
  button.ince:hover { border-color: var(--vurgu); }
  .not { background: var(--kart); border: 1px dashed var(--uyari); color: var(--uyari); border-radius: 12px;
         padding: 10px 14px; margin: 0 0 16px; font-size: 15px; }
  .durum { margin: 10px 2px 0; color: var(--soluk); font-size: 15px; min-height: 1.5em; }
  .durum.hazir { color: var(--tamam); }
  #acilisDurum { position: sticky; top: 0; z-index: 5; background: var(--zemin); margin: 0 -2px; padding: 8px 2px; }
  .kopruSecim { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--soluk); }
  .kopruSecim input { width: 18px; height: 18px; }
  /* 06.11 (Ercan): Heybe çalışırken gidip gelen üç nokta + saniye sayacı — "takıldı mı, çalışıyor mu" anlaşılsın */
  .durum .nokta { display: none; margin-inline-start: 6px; }
  .durum.calisiyor .nokta { display: inline-flex; gap: 3px; vertical-align: middle; }
  .durum .nokta i { width: 6px; height: 6px; border-radius: 50%; background: var(--vurgu); opacity: .25;
    animation: nokta 1.2s infinite ease-in-out; }
  .durum .nokta i:nth-child(2) { animation-delay: .2s; }
  .durum .nokta i:nth-child(3) { animation-delay: .4s; }
  @keyframes nokta { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .durum .sure { margin-inline-start: 8px; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .durum .nokta i { animation: none; opacity: .8; } }
  .durum.kotu { color: var(--dur); }
  .kart { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 14px; padding: 18px 20px; margin-top: 18px; }
  .kart h2 { margin: 0 0 8px; font-size: 18px; color: var(--vurgu); }
  .aciklama { color: var(--soluk); font-size: 15px; margin: 0 0 12px; }
  .cevap { white-space: pre-wrap; }
  /* 09.11 (§90): cevabın geldiği bölüm — okuyan konu dışı cevabı bir bakışta görsün */
  /* 10.11 (§96): konuşma çevirisi — iki kişi, iki dil; yüz yüzede üst panel ters döner */
  .kisi .kisiUst { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .kisi .kisiAd { font-weight: 600; color: var(--vurgu); }
  .kisi .kGelen { font-size: 24px; line-height: 1.35; margin: 12px 0 6px; min-height: 1.4em; white-space: pre-wrap; }
  .kisi .kisiYaz { display: flex; gap: 8px; margin-top: 10px; }
  .kisi .kGiden { font-size: 14px; color: var(--soluk); margin-top: 8px; white-space: pre-wrap; }
  .kisi .dur { font-size: 14px; margin-top: 4px; }
  #konusmaAlan.yuzYuze #kisi1 { transform: rotate(180deg); }
  .bolumSatir { margin: 0 0 10px; padding: 6px 10px; border-left: 4px solid var(--vurgu); background: var(--zemin); font-weight: 600; }
  #ozgunKutu { margin-top: 14px; }
  .kaynakCeviri { margin-top: 8px; padding-left: 10px; border-left: 3px solid var(--vurgu); }
  .kaynakCeviri .ceviriNot { font-size: 13px; color: var(--soluk); margin-top: 4px; }
  .kucukDugme { font-size: 14px; padding: 4px 10px; }
  .yanlisYer { margin-top: 14px; }
  .okuYer { margin-top: 8px; }
  .yanlisYer textarea { width: 100%; box-sizing: border-box; }
  #ozgunKutu summary { cursor: pointer; color: var(--soluk); font-size: 14px; }
  #ozgunKutu .cevap { margin-top: 8px; color: var(--soluk); }
  .cevap a { color: var(--vurgu); text-decoration: none; font-size: 13px; vertical-align: super; }
  .dur { color: var(--dur); }
  ol.kaynak { padding-left: 22px; margin: 0; }
  ol.kaynak li { margin-bottom: 14px; }
  ol.kaynak .etiket { font-size: 13px; color: var(--soluk); text-transform: uppercase; letter-spacing: .4px; }
  ol.kaynak .etiket.benim { color: var(--uyari); }
  ol.kaynak .ad { font-weight: 600; }
  ol.kaynak .ad a { color: inherit; }
  ol.kaynak .metin { color: var(--soluk); font-size: 15px; }
  ol.kaynak img, ol.kaynak video { display: block; max-width: 100%; max-height: 320px; margin-top: 8px; border-radius: 10px; }
  .alt-bag { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .alt-bag a, #geri { color: var(--vurgu); }
  ul.liste { list-style: none; padding: 0; margin: 0 0 8px; }
  ul.liste li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 0; border-top: 1px solid var(--cizgi); }
  ul.liste li:first-child { border-top: 0; }
  ul.liste .bilgi { flex: 1 1 260px; min-width: 0; }
  ul.liste .ust { font-weight: 600; }
  ul.liste .alt-satir { color: var(--soluk); font-size: 14px; }
  ul.liste .dugmeler { display: flex; gap: 8px; align-items: center; }
  ul.liste .dugmeler a { color: var(--vurgu); font-size: 15px; }
  ul.liste .rozet { font-size: 12px; color: var(--tamam); border: 1px solid var(--tamam); border-radius: 8px; padding: 1px 6px; margin-left: 6px; }
  ul.liste .rozet.uyari { color: var(--uyari); border-color: var(--uyari); }
  ul.liste progress { width: 100%; height: 8px; }
  .bos { color: var(--soluk); font-size: 15px; }
  .yigin { display: grid; gap: 10px; margin-top: 10px; }
  .yigin label { display: grid; gap: 4px; font-size: 15px; color: var(--soluk); }
  .yigin button { justify-self: start; }
  footer { color: var(--soluk); font-size: 14px; margin-top: 26px; }
  .diller.ek button .tik { display: inline; margin-inline-start: 6px; color: var(--tamam); font-size: 16px; }
  .diller.ek button.var { border-color: var(--tamam); }
  .acil { border-color: var(--dur); margin-top: 14px; padding: 12px 16px; }
  .kilavuz summary { cursor: pointer; font-weight: 600; color: var(--vurgu); }
  a.dugmeBag { display: inline-block; padding: 6px 14px; border: 1px solid var(--vurgu); border-radius: 10px; text-decoration: none; font-weight: 600; color: var(--vurgu); }
  .kilavuz p { margin: 10px 0 0; font-size: 15px; }
  .hazirListeler button { margin: 3px 4px 3px 0; }
  #listeMetin { width: 100%; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; margin-top: 8px; }
  .saglik { font-size: 13px; }
  .saglik.iyi { color: var(--tamam); }
  .saglik.kotu { color: var(--uyari); }
  .acil summary { cursor: pointer; font-weight: 600; color: var(--dur); }
  .acil h3 { margin: 12px 0 4px; font-size: 15px; color: var(--soluk); }
  .acilMetin { white-space: pre-wrap; margin-top: 8px; font-size: 18px; }
  ul.acilNo { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 15px; }
  ul.acilNo b { font-size: 17px; }
  .acil p { margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- İlk ekran: dil seçimi. Her dil kendi adıyla ve kendi alfabesiyle yazılır. -->
  <section id="dilEkrani" hidden>
    <h1>CLE Heybe</h1>
    <!-- 07.11 gece (Ercan: "Heybe ilk yüklenirken de bir hareketli … ibare koyabilir miyiz ? Kullanıcı yükleniyor bilsin
         işlem bitince hazır desin"): modeller 1–3 dakika açılırken kullanıcı bu ekranda bekliyor, işaret yalnız ana ekrandaydı.
         Ercan (ardından): "Göstergesini üstte koyalım her zaman görünür olur" → başlığın altında, kaydırınca da üstte kalır -->
    <p class="durum calisiyor" id="acilisDurum" role="status" aria-live="polite"><span class="dm"></span><span class="nokta" aria-hidden="true"><i></i><i></i><i></i></span><span class="sure"></span></p>
    <p class="alt" id="dilSecBaslik">🌐</p>
    <div class="acilYer" id="acilYerDil"></div>
    <!-- 06.11 gece (Ercan: "tüm diller eşit görünsün kullanıcı dili seçsin"): bütün diller tek ızgarada, adının
         sırasıyla; bellekte o dilde kitap ya da dosya varsa yanında ✓ -->
    <div class="diller ek" id="dilDugmeleri"></div>
    <p class="ekNot" id="dilEkNot"></p>
  </section>

  <section id="anaEkran" hidden>
    <h1>CLE Heybe</h1>
    <p class="alt" data-m="altBaslik"></p>
    <p class="not" id="dilNotu" hidden></p>
    <!-- İlk açılış önerisi (Ercan 07.11: "hiç bilgisi olmayan kullanıcı dahil sistemi kurar kütüphanesini oluşturur") -->
    <p id="oneriSatir" class="hazirListeler" hidden></p>
    <p class="durum" id="oneriDurum" hidden></p>

    <form id="form">
      <input id="soru" type="text" autocomplete="off" disabled>
      <button id="sor" type="submit" disabled data-m="sor"></button>
    </form>
    <label class="kopruSecim" id="kopruSatir" hidden><input type="checkbox" id="kopruAc"> <span data-m="kopruSecim"></span> <span id="kopruDurum"></span></label>
    <p class="durum" id="durum" role="status" aria-live="polite"><span class="dm"></span><span class="nokta" aria-hidden="true"><i></i><i></i><i></i></span><span class="sure"></span></p>
    <!-- ilk kurulum (08.11, Özet §66): modeller yoksa ana ekranda yol gösterir -->
    <p id="kurulumNotu" hidden><button type="button" id="kurulumBag" data-m="kurulumAc"></button></p>
    <div class="acilYer" id="acilYerAna"></div>

    <section class="kart" id="cevapKart" hidden>
      <h2 data-m="cevapBaslik"></h2>
      <p class="bolumSatir" id="bolumSatir" dir="auto" hidden></p>
      <div class="cevap" id="cevap"></div>
      <!-- 10.11 (Ercan: "cevap geldi ama sesli butonu göremedim"): cevabı bilgisayarın kendi sesiyle okur -->
      <div class="okuYer" id="cevapOkuYer" hidden><button type="button" class="kucukDugme" id="cevapOku" data-m="konusmaOku"></button></div>
      <details id="ozgunKutu" hidden><summary id="ozgunBaslik"></summary><div class="cevap" id="ozgunMetin"></div></details>
      <!-- "Bu cevap yanlış" (Ö18, 07.11): kayıt yalnız bu bellekte kalır -->
      <div class="yanlisYer">
        <button type="button" class="kucukDugme" id="yanlisAc" data-m="yanlisDugme"></button>
        <form id="yanlisForm" class="yigin" hidden>
          <label><span data-m="yanlisNotAlan"></span><textarea id="yanlisNot" rows="3" dir="auto" maxlength="4000"></textarea></label>
          <div><button type="submit" id="yanlisKaydet" data-m="yanlisKaydet"></button> <button type="button" class="kucukDugme" id="yanlisVazgec" data-m="vazgec"></button></div>
        </form>
        <p class="durum" id="yanlisDurum" hidden></p>
      </div>
    </section>

    <section class="kart" id="kaynakKart" hidden>
      <h2 data-m="kaynakBaslik"></h2>
      <ol class="kaynak" id="kaynaklar"></ol>
    </section>

    <div class="alt-bag">
      <a id="kitaplikBag" href="#" class="dugmeBag" data-m="kitaplikAyar"></a>
      <!-- 09.11 (harita 8i): bellekte harita varsa görünür; harita sayfası ayrı (MapLibre ana sayfayı ağırlaştırmasın) -->
      <a id="haritaBag" href="/heybe/harita.html" data-m="haritaBag" hidden></a>
      <!-- 10.11 (§96): çevirmen modeli varsa -->
      <a id="konusmaBag" href="#" data-m="konusmaBag" hidden></a>
      <a id="kutuphaneBag" href="/kiwix/" target="_blank" data-m="kutuphane"></a>
      <a id="dilDegistir" href="#" data-m="dilDegistir"></a>
    </div>

    <footer><span data-m="altBilgi"></span><br>CLE — Can · LM · Ercan<span id="surum"></span></footer>
  </section>

  <!-- Kitaplık: Heybe bir klasördür (K13). Kitabı kullanıcı seçer; kendi dosyasını da ekler. -->
  <!-- 10.11 (Özet §96, Ercan: "iki yabancı karşılaştı belki kendi aralarında konuşmak isteyecek"): konuşma çevirisi.
       Her panel kendi seçtiği dilde yazar; çeviri karşı panelde büyük, konuşanın cümlesinin geri çevirisi kendi altında. -->
  <section id="konusmaEkrani" hidden>
    <p><a href="#" id="konusmaGeri" data-m="geri"></a></p>
    <h1 data-m="konusmaBaslik"></h1>
    <p class="alt" data-m="konusmaAciklama"></p>
    <!-- 10.11 (Ercan): çevirmen hazırlanırken de açılıştaki noktalar + saniye; saniye ekran okuyucuya her saniye okunmasın -->
    <p class="durum" id="konusmaDurum" role="status" aria-live="polite"><span class="dm"></span><span class="nokta" aria-hidden="true"><i></i><i></i><i></i></span><span class="sure" aria-hidden="true"></span></p>
    <label class="kopruSecim"><input type="checkbox" id="konusmaYuz"> <span data-m="konusmaYuzYuze"></span></label>
    <div id="konusmaAlan"></div>
  </section>

  <section id="kitaplikEkrani" hidden>
    <p><a href="#" id="geri" data-m="geri"></a></p>
    <h1 data-m="kitaplik"></h1>
    <p class="alt" id="diskBilgi"></p>
    <p class="not" id="fatNotu" hidden data-m="fat"></p>

    <!-- İlk kurulum (08.11, Özet §66 — Ercan: "asıl en önemli amacımız normal bir kullanıcı bunu indirip kurabilmesi"):
         GitHub paketi modelsiz gelir; Gemma koşullarını kullanıcı kendisi kabul eder (K19), yardımcı program indirir -->
    <section class="kart" id="modelKart" hidden>
      <h2 data-m="kurulumBaslik"></h2>
      <p class="aciklama" id="kurulumAciklama"></p>
      <ul class="liste" id="modelListesi"></ul>
      <label class="kopruSecim"><input type="checkbox" id="kurulumKabul" aria-labelledby="kurulumKosul"> <span id="kurulumKosul"></span></label>
      <p><button type="button" id="kurulumIndir"></button> <span class="durum" id="kurulumDurum" role="status" aria-live="polite"></span></p>
    </section>

    <!-- Kitaplık kılavuzu çekirdeğin içinde (Ercan 06.11, Özet §34) -->
    <details class="kart kilavuz" id="kilavuzKart"><summary data-m="kilavuzBaslik"></summary><div id="kilavuzMetin"></div></details>

    <!-- Açılış dili (07.11 gece, Ercan: "İlk kurulumda standart İngilizce açılsın · Browser de kullanıcı seçim yapabilsin
         sonraki seferde hangi dilde açılsın"): seçim bellekte (heybe/benim/ayar.json), bilgisayardan bağımsız -->
    <section class="kart" id="acilisDiliKart">
      <h2 data-m="acilisDiliBaslik"></h2>
      <p class="aciklama" data-m="acilisDiliAciklama"></p>
      <p><select id="acilisDiliSec"></select> <span class="durum" id="acilisDiliDurum"></span></p>
    </section>

    <section class="kart">
      <h2 data-m="bellektekiler"></h2>
      <ul class="liste" id="kitapListesi"></ul>
    </section>

    <!-- Kitap listem (Ö11, 07.11): liste yalnız ad taşır; Heybe katalogla karşılaştırır, eksiği indirir, yeniyi getirir -->
    <section class="kart" id="listeKart">
      <h2 data-m="listeBaslik"></h2>
      <p class="aciklama" data-m="listeAciklama"></p>
      <p class="hazirListeler"><span data-m="hazirListeler"></span> <span id="hazirListeler"></span></p>
      <textarea id="listeMetin" rows="6" spellcheck="false" dir="ltr" autocomplete="off"></textarea>
      <label class="kopruSecim"><input type="checkbox" id="listeOtomatik"> <span data-m="listeOtomatik"></span></label>
      <p><button type="button" id="listeKaydet" data-m="listeKaydet"></button> <button type="button" class="kucukDugme" id="listeDenetle" data-m="listeDenetle"></button> <span class="durum" id="listeDurumYazi"></span></p>
      <ul class="liste" id="listeDurumListesi"></ul>
      <p id="listeEylem" hidden><button type="button" id="listeIndir"></button> <button type="button" id="listeGuncelle"></button></p>
    </section>

    <section class="kart" id="indirmeKart" hidden>
      <h2 data-m="indirmeler"></h2>
      <ul class="liste" id="indirmeListesi"></ul>
    </section>

    <section class="kart">
      <h2 data-m="benimBaslik"></h2>
      <p class="aciklama" data-m="benimAciklama"></p>
      <ul class="liste" id="benimListesi"></ul>
      <form id="yukleForm" class="yigin">
        <label><span data-m="dosyaSec"></span>
          <input type="file" id="dosya" accept=".pdf,.txt,.md,.jpg,.jpeg,.png,.gif,.webp,.mp4,.webm,.m4v,.mov" required></label>
        <label><span data-m="baslikAlan"></span><input type="text" id="dosyaBaslik" autocomplete="off"></label>
        <label><span data-m="aciklamaAlan"></span><textarea id="dosyaAciklama" rows="3"></textarea></label>
        <label><span data-m="dilAlan"></span>
          <select id="dosyaDil"><option value="tr">Türkçe</option><option value="en">English</option><option value="cs">Čeština</option></select></label>
        <p class="aciklama" id="dilTahminNotu" hidden></p>
        <button type="submit" id="ekleDugme" data-m="ekle"></button>
        <p class="durum" id="yukleDurum"></p>
      </form>
    </section>

    <!-- "Bu cevap yanlış" kayıtları (Ö18, 07.11): yalnız bu bellekte; kullanıcı indirip verebilir -->
    <section class="kart" id="yanlisKart">
      <h2 data-m="yanlisBaslik"></h2>
      <p class="aciklama" data-m="yanlisAciklama"></p>
      <ul class="liste" id="yanlisListesi"></ul>
      <p id="yanlisIndirSatir" hidden><a id="yanlisIndir" href="/api/yanlis?indir=1" download class="dugmeBag" data-m="yanlisIndir"></a></p>
    </section>

    <section class="kart">
      <h2 data-m="indirBaslik"></h2>
      <p class="aciklama" data-m="indirAciklama"></p>
      <form id="katalogForm" class="satir">
        <select id="katalogDil"><option value="tur">Türkçe</option><option value="eng">English</option><option value="ces">Čeština</option></select>
        <input type="text" id="katalogAra" autocomplete="off">
        <button type="submit" data-m="ara"></button>
      </form>
      <p class="durum" id="katalogDurum"></p>
      <ul class="liste" id="katalogListesi"></ul>
      <!-- Bağlantıdan ekle (Ercan 07.11): başka sitedeki .zim kitabı ya da PDF, metin, resim -->
      <h3 data-m="baglantiBaslik"></h3>
      <p class="aciklama" data-m="baglantiAciklama"></p>
      <form id="baglantiForm" class="satir">
        <input type="url" id="baglantiAdres" autocomplete="off" required placeholder="https://…/kitap.zim · https://…/belge.pdf">
        <button type="submit" data-m="baglantiEkle"></button>
      </form>
      <p class="durum" id="baglantiDurum"></p>
    </section>
  </section>
</main>

<!-- Acil kart (Ö14): tek kart, açık ekrana taşınır (dil ekranı · ana ekran). Modeller açılmadan görünür. -->
<section class="kart acil" id="acilKart">
  <details id="acilAc" open>
    <summary><span id="acilBaslik"></span></summary>
    <div class="acilMetin" id="acilMetin" dir="auto" hidden></div>

  // Makine çevirisi metinleri İngilizce metinlerin üstüne giydirilir; eksik ya da bozuk olan İngilizce kalır
  function metinKur(taban, ek) {
    const o = {};
    for (const [k, v] of Object.entries(taban)) {
      const e = ek ? ek[k] : undefined;
      if (typeof v === 'function') {
        o[k] = typeof e === 'string' ? (...a) => e.replace(/\{(\d)\}/g, (x, i) => a[i] ?? '').replace(/\s*·\s*$/, '') : v;
      } else if (v && typeof v === 'object') o[k] = metinKur(v, e);
      else o[k] = typeof e === 'string' && e ? e : v;
    }
    return o;
  }
  // 07.11 dil tanıma taraması: çevirmen Pencapça (pa) yerine Hintçe, Zuluca (zu) yerine Nepalce yazıyor → bu iki dil ekrandan
  // çıktı (ekran yazısı da cevap da başka dilde çıkardı). Çevirmen bu dilleri öğrenince geri gelir.
  const CEVIRMENIN_YAZAMADIGI = new Set(['pa', 'zu']);
  for (const [d, ek] of Object.entries(window.HEYBE_METIN_EK || {})) if (!METIN[d] && !CEVIRMENIN_YAZAMADIGI.has(d)) METIN[d] = metinKur(METIN.en, ek);

  const $ = (id) => document.getElementById(id);
  // Açılış ekranı (06.11 gece, Ercan: "tüm diller eşit görünsün kullanıcı dili seçsin. Aksi halde haksızlık gibi
  // oluyor"): metni olan her dil aynı boyda bir düğme, kendi adıyla ve adının sırasıyla. Öne çıkan dil yok.
  {
    const siralama = new Intl.Collator('en', { sensitivity: 'base' });
    const hepsi = Object.keys(METIN).map((k) => [k, dilAdiKisa(k)]).sort((a, b) => siralama.compare(a[1], b[1]));
    for (const [kisa, ad] of hepsi) {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.dil = kisa; b.lang = kisa; b.dir = SAGDAN.has(kisa) ? 'rtl' : 'ltr';
      b.textContent = ad;
      $('dilDugmeleri').appendChild(b);
    }
  }
  // Dil ekranının kendi yazıları (başlık, not, açılış satırı, acil kart): standart İngilizce — 07.11 gece, Ercan:
  // "açılıştı standart ingilizce olsun malum en yaygın dil o". Eskiden son seçilen dil ya da tarayıcının diliydi.
  // Her dil düğmesi kendi adıyla yazılı; son seçilen dil yine öne çıkarılır (dilEkraniGoster).
  // 07.11 gece (ikinci adım, Ercan): kullanıcı "Kitaplık ve ayarlar"dan açılış dilini seçebilir; seçim bellekte saklanır.
  let acilisDili = '';
  function ekranDili() {
    return METIN[acilisDili] ? acilisDili : 'en';
  }
  async function ayarOku() {
    try { const a = await (await fetch(`${API}/ayar`, { cache: 'no-store' })).json(); acilisDili = METIN[a.acilisDili] ? a.acilisDili : ''; }
    catch (e) { acilisDili = ''; }   // eski yardımcı program ya da okunamadı: standart
  }
  function acilisDiliKur() {
    const m = METIN[dil] || METIN.en, s = $('acilisDiliSec');
    s.innerHTML = '';
    const ilk = document.createElement('option');
    ilk.value = ''; ilk.textContent = m.acilisDiliStandart || METIN.en.acilisDiliStandart;
    s.appendChild(ilk);
    const siralama = new Intl.Collator('en', { sensitivity: 'base' });
    for (const [k, ad] of Object.keys(METIN).map((k) => [k, dilAdiKisa(k)]).sort((a, b) => siralama.compare(a[1], b[1]))) {
      const o = document.createElement('option');
      o.value = k; o.textContent = ad; o.lang = k;
      s.appendChild(o);
    }
    s.value = acilisDili;
    $('acilisDiliDurum').textContent = '';
  }
  // ✓: bellekte o dilde aranabilir kitap ya da kullanıcı dosyası var. Kütüphane birkaç saniyede açılır → bekler.
  async function dilTikleri(deneme = 0) {
    let diller;
    try { diller = await H.bellektekiDiller(true); }
    catch (e) { if (deneme < 60) setTimeout(() => dilTikleri(deneme + 1), 2000); return; }
    const m = METIN[ekranDili()];
    document.querySelectorAll('#dilDugmeleri [data-dil]').forEach((b) => {
      const var_ = diller.has(b.dataset.dil);
      b.classList.toggle('var', var_);
      let t = b.querySelector('.tik');
      if (var_ && !t) { t = document.createElement('span'); t.className = 'tik'; t.textContent = '✓'; b.appendChild(t); }
      if (!var_ && t) t.remove();
      if (t) t.title = m.dilVar;
      b.setAttribute('aria-label', b.firstChild.textContent + (var_ ? ` (${m.dilVar})` : ''));
    });
  }
  for (const [kisa, uc] of EK_DILLER) {
    $('dosyaDil').add(new Option(dilAdiKisa(kisa), kisa));
    $('katalogDil').add(new Option(dilAdiKisa(kisa), uc));

  fetch('/heybe/surum.json').then((y) => y.json()).then((s) => { $('surum').textContent = ` · ${s.ad} ${s.surum}`; }).catch(() => {});

  let dil = null;
  let durumAnahtari = 'hazirlaniyor', durumEk;   // dil değişince durum satırı da yeni dilde yazılsın
  let disk = null;                               // yardımcının son durum bilgisi

  function sakla(d) { try { localStorage.setItem('heybe.dil', d); } catch (e) { /* gizli pencere: her açılışta sorulur */ } }
  function hatirla() { try { return localStorage.getItem('heybe.dil'); } catch (e) { return null; } }

  function yazi(metin) {
    const d = document.createElement('div');
    d.textContent = metin == null ? '' : String(metin);
    return d.innerHTML.replace(/"/g, '&quot;');
  }

  function yolKodla(yol) { return String(yol).split('/').map(encodeURIComponent).join('/'); }

  function boyutYaz(b) {
    const s = (x, k) => x.toLocaleString(dil || 'tr', { maximumFractionDigits: k });
    if (b >= 1024 ** 3) return `${s(b / 1024 ** 3, 1)} GB`;
    if (b >= 1024 ** 2) return `${s(b / 1024 ** 2, 0)} MB`;
    return `${s(Math.max(1, b / 1024), 0)} KB`;
  }

  async function api(yol, govde) {
    const yanit = await fetch(`${API}/${yol}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Heybe': '1' }, body: JSON.stringify(govde || {}),
    });
    const veri = await yanit.json().catch(() => ({}));
    if (!yanit.ok) throw new Error(veri.hata || yanit.status);
    return veri;
  }

  // Heybe'nin çalıştığı adımlar: bu adımlarda noktalar oynar ve geçen süre işler (06.11, Ercan'ın isteği)
  const CALISAN = new Set(['hazirlaniyor', 'baslik', 'kaynak', 'kopru', 'cevap']);
  let sayacBas = 0, sayac = null;
  function sureYaz() {
    const sn = Math.floor((Date.now() - sayacBas) / 1000);
    durum.querySelector('.sure').textContent = sayac && sn > 0 ? `⏱ ${sn}` : '';
  }
  function durumYaz(anahtar, ek) {
    durumAnahtari = anahtar; durumEk = ek;
    const m = METIN[dil] ? METIN[dil][anahtar] : '';
    durum.querySelector('.dm').textContent = typeof m === 'function' ? m(ek) : (m || '') + (typeof ek === 'string' || typeof ek === 'number' ? ek : '');
    const calisiyor = CALISAN.has(anahtar);
    durum.className = 'durum' + (anahtar === 'hazir' ? ' hazir' : '') + (calisiyor ? ' calisiyor' : '');
    if (calisiyor && !sayac) { sayacBas = Date.now(); sayac = setInterval(sureYaz, 1000); }
    if (!calisiyor && sayac) { clearInterval(sayac); sayac = null; }
    sureYaz();
  }

  async function dilNotuGuncelle() {
    if (!dil) return;
    let var_ = true;
    try { var_ = (await H.kitaplik()).some((k) => k.aranir && k.dil.split(',').some((u) => u === KIWIX_DIL[dil] || H.KISA[u] === dil)); } catch (e) { /* kütüphane açılıyor */ }
    $('dilNotu').textContent = METIN[dil].bosDil;
    $('dilNotu').hidden = var_;
    oneriKur(!var_);
  }

  // İlk açılış önerisi: kullanıcının dilinde kitap yoksa hazır listesi tek tıkla (boyutu düğmede yazar = onay)
  function oneriKur(goster) {
    const m = METIN[dil], kutu = $('oneriSatir');
    kutu.innerHTML = ''; kutu.hidden = !goster;
    if (!goster) return;
    const listeler = [DIL_LISTESI[dil], dil !== 'en' ? 'ilkyardim_en' : 'tip_en'].filter(Boolean);
    for (const id of listeler) kutu.appendChild(dugme(m.ilkOneri(m.hazirAd[id] || id), () => ilkOneriIndir(id)));
    kutu.appendChild(dugme(m.oneriBak, () => {   // hazır listesi olmayan diller için: kataloğu o dilde aç
      ekranGoster('kitaplikEkrani'); kitaplikYenile();
      $('katalogDil').value = KIWIX_DIL[dil] || H.UC[dil] || 'eng';
      $('katalogForm').requestSubmit();
    }));
  }
  async function ilkOneriIndir(id) {
    const m = METIN[dil], d = $('oneriDurum');
    d.hidden = false; d.className = 'durum calisiyor'; d.textContent = m.listeDenetleniyor;
    try {
      const l = await (await fetch(`${API}/liste`, { cache: 'no-store' })).json();
      await api('liste', { metin: listeyeEkle(l.metin || '', await hazirListeMetni(id)) });
      await api('liste-uygula', { guncelle: false });
      d.className = 'durum hazir'; d.textContent = m.ilkOneriBasladi;
    } catch (e) {
      d.className = 'durum kotu'; d.textContent = m.ilkOneriInternetYok;
    }
  }

  function ekranGoster(ad) {
    for (const e of ['dilEkrani', 'anaEkran', 'kitaplikEkrani', 'konusmaEkrani']) $(e).hidden = e !== ad;
    // acil kart açık ekrana taşınır; kitaplıkta görünmez (Ö14)
    const yer = { dilEkrani: 'acilYerDil', anaEkran: 'acilYerAna' }[ad];
    if (yer) $(yer).appendChild($('acilKart'));
    $('acilKart').hidden = !yer;
    acilYazilari();
    window.scrollTo(0, 0);
  }

  function dilUygula(d) {
    dil = METIN[d] ? d : 'tr';
    document.documentElement.lang = dil;
    document.documentElement.dir = SAGDAN.has(dil) ? 'rtl' : 'ltr';
    const m = METIN[dil];
    document.querySelectorAll('[data-m]').forEach((o) => { o.textContent = m[o.dataset.m]; });
    $('soru').placeholder = m.ornek;
    $('katalogAra').placeholder = m.araAlan;
    $('dosyaDil').value = dil;
    $('katalogDil').value = KIWIX_DIL[dil] || H.UC[dil] || 'eng';
    kilavuzYaz();
    durumYaz(durumAnahtari, durumEk);
    kopruDurumYaz(kopruAnahtari);
    kopruHazirla();
    dilNotuGuncelle();
    ekranGoster('anaEkran');
  }

  function dilEkraniGoster() {
    const m = METIN[ekranDili()];
    $('dilSecBaslik').textContent = '🌐 ' + m.dilSec;
    $('dilEkNot').textContent = m.dilEkNot;
    dilTikleri();
    ekranGoster('dilEkrani');
    const onceki = document.querySelector(`[data-dil="${dil || hatirla() || 'tr'}"]`);
    if (onceki) onceki.focus();
  }

  document.querySelectorAll('[data-dil]').forEach((d) => d.addEventListener('click', () => {
    sakla(d.dataset.dil);
    dilUygula(d.dataset.dil);
    if (!$('soru').disabled) $('soru').focus();
  }));
  $('dilDegistir').addEventListener('click', (o) => { o.preventDefault(); dilEkraniGoster(); });
  $('kitaplikBag').addEventListener('click', (o) => { o.preventDefault(); ekranGoster('kitaplikEkrani'); kitaplikYenile(); });
  // 09.11: harita bağlantısı yalnız harita varsa; sayfa seçili dille açılır
  fetch('/api/harita', { cache: 'no-store' }).then((r) => r.json()).then((h) => { $('haritaBag').hidden = !h.var; }).catch(() => {});
  $('haritaBag').addEventListener('click', () => { $('haritaBag').href = '/heybe/harita.html?dil=' + encodeURIComponent(dil || 'en'); });
  $('geri').addEventListener('click', (o) => { o.preventDefault(); ekranGoster('anaEkran'); dilNotuGuncelle(); });

  // ---- soru ve cevap ----

  async function hazirMi(url) {
    try { const c = await fetch(url + '/health'); return c.ok && (await c.json()).status === 'ok'; }
    catch (e) { return false; }
  }

  // ---- açılış göstergesi (07.11 gece, Ercan'ın isteği): hangi parça hazır, ne kadar zaman geçti; bitince "hazır" ----
  // Dil ekranında da görünür. Ana ekrandaki "hazırlanıyor" satırına da aynı adımlar eklenir.
  const acilis = { bas: Date.now(), kutuphane: false, anlam: false, sohbet: false, modelEksik: false, modelSon: 0 };
  const acilisBitti = () => acilis.anlam && acilis.sohbet;
  function acilisAdimlari(m) {
    const a = m.acilisAdim || METIN.en.acilisAdim;
    return ['kutuphane', 'anlam', 'sohbet'].map((k) => `${a[k]} ${acilis[k] ? '✓' : '…'}`).join(' · ');
  }
  function acilisYaz() {
    const m = METIN[dil] || METIN[ekranDili()] || METIN.en, d = $('acilisDurum');
    const sn = Math.floor((Date.now() - acilis.bas) / 1000);
    d.className = 'durum' + (acilisBitti() ? ' hazir' : acilis.modelEksik ? '' : ' calisiyor');
    d.querySelector('.dm').textContent = acilisBitti() ? m.acilisHazir : acilis.modelEksik ? m.kurulumGerekKisa
      : `${m.acilisHazirlaniyor} — ${acilisAdimlari(m)}${sn > 360 ? ' · ' + m.acilisUzun : ''}`;
    d.querySelector('.sure').textContent = acilisBitti() || acilis.modelEksik || sn < 1 ? '' : `⏱ ${sn}`;
  }
  const acilisSayac = setInterval(() => { acilisYaz(); if (acilisBitti()) clearInterval(acilisSayac); }, 1000);

  async function bekle() {
    if (!acilis.kutuphane) { try { await H.kitaplik(); acilis.kutuphane = true; } catch (e) { /* kütüphane açılıyor */ } }
    if (!acilis.anlam) acilis.anlam = await hazirMi(H.AYAR.gomme);
    if (!acilis.sohbet) acilis.sohbet = await hazirMi(H.AYAR.sohbet);
    if (!acilisBitti() && Date.now() - acilis.modelSon > 5000) { acilis.modelSon = Date.now(); await modelleriYenile(); }
    acilisYaz();
    if (dil && !acilisBitti() && ['hazirlaniyor', 'kurulumGerek'].includes(durumAnahtari)) {
      if (acilis.modelEksik) durumYaz('kurulumGerek'); else durumYaz('hazirlaniyor', ` (${acilisAdimlari(METIN[dil])})`);
    }
    if (acilisBitti()) {
      $('soru').disabled = false; $('sor').disabled = false;
      modellerHazir = true;
      kopruHazirla();
      if (dil) durumYaz('hazir'); else durumAnahtari = 'hazir';
      if (!$('anaEkran').hidden) $('soru').focus();
      dilNotuGuncelle();
    } else {
      setTimeout(bekle, 2000);
    }
  }

  async function cevirmenBekle(bas) {
    // çevirmen istenince yardımcı program açar; hazır olunca köprü açılır (seçim işaretliyse). 15 dk sonra bırakır.
    if (await hazirMi(CEVIRMEN)) {
      if ($('kopruAc').checked) H.AYAR.cevirmen = CEVIRMEN;
      kopruDurumYaz('hazir');
      kopruBekliyor = false;
      return;
    }
    if (Date.now() - bas < 15 * 60 * 1000) setTimeout(() => cevirmenBekle(bas), 3000);
    else kopruBekliyor = false;
  }

  // ---- acil kart (Ö14) ----
  // Kullanıcının kendi kartı ve ülkelerin acil numaraları; modeller açılmadan ilk saniyede görünür. Heybe karta
  // kendi ilk yardım adımı yazmaz (doğrulanmamış bilgi yok — K1). Numaralar LISANSLAR.txt ile aynı (06.11).
  const ACIL_NO = [
    { b: ['TR'], n: [['112']] }, { b: ['EU'], n: [['112']] }, { b: ['CZ'], n: [['155', 'ambulans'], ['112']] },
    { b: ['NO'], n: [['113', 'ambulans'], ['112', 'polis']] }, { b: ['GB'], n: [['999']] }, { b: ['US', 'CA'], n: [['911']] },
    { b: ['AU'], n: [['000']] }, { b: ['IN'], n: [['112']] }, { b: ['CN'], n: [['120', 'ambulans']] },
  ];
  // 06.11: "ambulans" kısa kelime olarak çevirmende "doğum arabası", "noter aracı" gibi oldu → görünen işaret dilden bağımsız
  const ISARET = { ambulans: '🚑', polis: '🚓' };
  let acilKartMetni = '', acilElle = false;
  function bolgeAdi(kod, ui) {
    try { return new Intl.DisplayNames([ui], { type: 'region' }).of(kod); } catch (e) { return kod; }
  }
  function acilYazilari() {
    const ui = dil || ekranDili(), m = METIN[ui];
    $('acilKart').lang = ui; $('acilKart').dir = SAGDAN.has(ui) ? 'rtl' : 'ltr';
    $('acilBaslik').textContent = m.acilBaslik;
    $('acilBos').textContent = m.acilBos;
    $('acilKaydet').textContent = m.acilKaydet;
    $('acilVazgec').textContent = m.acilVazgec;
    $('acilNumaraBaslik').textContent = m.acilNumaralar;
    $('acilNoNot').textContent = m.acilNoNot;
    // tarayıcının bölgesi (ör. nb-NO → NO) listede öne alınır
    const bolgeler = (navigator.languages || []).map((t) => (String(t).split('-')[1] || '').toUpperCase());
    const sira = [...ACIL_NO].sort((a, b) => (a.b.some((x) => bolgeler.includes(x)) ? 0 : 1) - (b.b.some((x) => bolgeler.includes(x)) ? 0 : 1));
    $('acilNumaralar').innerHTML = sira.map((s) => `<li>${yazi(s.b.map((x) => bolgeAdi(x, ui)).join(', '))}: ` +
      s.n.map(([no, tur]) => `<b>${no}</b>${tur ? ` <span role="img" title="${yazi(m[tur])}" aria-label="${yazi(m[tur])}">${ISARET[tur]}</span>` : ''}`).join(' · ') + '</li>').join('');
    // düzenleme yalnız ana ekranda (dil seçilmeden kimin kartı yazdığı belli değil)
    const duzenlenir = !!dil && !$('anaEkran').hidden;
    $('acilMetin').textContent = acilKartMetni;
    $('acilMetin').hidden = !acilKartMetni || !$('acilForm').hidden;
    $('acilBos').hidden = !!acilKartMetni || !duzenlenir || !$('acilForm').hidden;
    $('acilDuzenle').textContent = acilKartMetni ? m.acilDuzenle : m.acilYaz;
    $('acilDuzenle').hidden = !duzenlenir || !$('acilForm').hidden;
    if (!duzenlenir) $('acilForm').hidden = true;
    $('acilAlt').hidden = $('acilDuzenle').hidden && !$('acilDurum').textContent;
  }
  async function acilKartOku() {
    try {
      const y = await fetch(`${API}/acil-kart`, { cache: 'no-store' });
      if (y.status === 404) return;   // eski yardımcı program: kart yok, yalnız numaralar
      acilKartMetni = (await y.json()).metin || '';
    } catch (e) { setTimeout(acilKartOku, 2000); return; }
    acilYazilari();
  }
  $('acilAc').querySelector('summary').addEventListener('click', () => { acilElle = true; });
  $('acilDuzenle').addEventListener('click', () => {
    $('acilYazi').value = acilKartMetni; $('acilForm').hidden = false; $('acilDurum').textContent = '';
    acilYazilari(); $('acilYazi').focus();
  });
  $('acilVazgec').addEventListener('click', () => { $('acilForm').hidden = true; acilYazilari(); });
  $('acilForm').addEventListener('submit', async (o) => {
    o.preventDefault();
    const m = METIN[dil];
    $('acilKaydet').disabled = true;
    try {
      acilKartMetni = (await api('acil-kart', { metin: $('acilYazi').value })).metin || '';
      $('acilForm').hidden = true;
      $('acilDurum').textContent = m.acilKaydedildi; $('acilDurum').className = 'durum hazir';
    } catch (e) {
      $('acilDurum').textContent = m.hata + e.message; $('acilDurum').className = 'durum kotu';
    } finally {
      $('acilKaydet').disabled = false;
      acilYazilari();
    }
  });

  // Dil köprüsü seçimi (06.11, Ercan: "kullanıcı hangi diller yüklensin seçer" — Özet §36): işaretliyse çevirmen
  // gerekince açılır; değilse hiç yüklenmez, Heybe yalnız kullanıcının dilindeki kaynaklarla çalışır.
  let kopruIstek = (() => { try { return localStorage.getItem('heybe.kopru'); } catch (e) { return null; } })();
  // 06.11 sınav: ilk açılışta dil seçilmeden önce modeller hazır olunca METIN[null] hata verdi, kutu işaretli göründü
  // ama köprü bağlanmadı → durum anahtarı saklanır, yazı dil seçilince yazılır; seçim dil belli olunca kurulur.
  let modellerHazir = false, kopruAnahtari = '', kopruBekliyor = false;
  function kopruDurumYaz(d) {
    kopruAnahtari = d;
    const m = METIN[dil];
    $('kopruDurum').textContent = !m ? '' : d === 'hazir' ? m.cevirmenHazir : (d === 'aciliyor' ? m.cevirmenAciliyor : '');
  }
  async function kopruAc() {
    try { kopruDurumYaz((await api('cevirmen', { ac: true })).durum); } catch (e) { kopruDurumYaz(''); return; }
    if (!kopruBekliyor) { kopruBekliyor = true; cevirmenBekle(Date.now()); }
  }
  async function kopruHazirla() {
    if (!modellerHazir || !dil) return;   // "başka dil" ancak kullanıcının dili seçilince belli olur
    let durum = 'yok';
    try { durum = (await (await fetch(`${API}/cevirmen`)).json()).durum; } catch (e) { /* eski yardımcı: seçim yok */ }
    if (durum === 'yok') return;   // çevirmen dosyası yok → seçim gösterilmez, köprü yok
    $('kopruSatir').hidden = false;
    let diger = [];
    try { diger = await H.mevcutDiller(dil); } catch (e) { /* kitaplık açılıyor */ }
    // ilk kez: bellekte başka dilde kitap ya da dosya varsa işaretli; sonra kullanıcının son seçimi
    $('kopruAc').checked = kopruIstek === null ? diger.length > 0 : kopruIstek === '1';
    if ($('kopruAc').checked) kopruAc(); else { H.AYAR.cevirmen = ''; kopruDurumYaz(durum); }
  }
  $('kopruAc').addEventListener('change', () => {
    kopruIstek = $('kopruAc').checked ? '1' : '0';
    try { localStorage.setItem('heybe.kopru', kopruIstek); } catch (e) { /* gizli pencere */ }
    if ($('kopruAc').checked) kopruAc(); else { H.AYAR.cevirmen = ''; kopruDurumYaz(''); }
  });

  function kaynakCeviriDugmesi(p) {
    // başka dildeki kaynak paragrafı istek üzerine kullanıcının diline çevrilir; sayı denetçisi çeviriyi özgüne karşı sınar
    const kutu = document.createElement('div');
    kutu.className = 'kaynakCeviri';
    const dugme = document.createElement('button');
    dugme.type = 'button'; dugme.className = 'kucukDugme'; dugme.textContent = METIN[dil].kaynakCevir;
    dugme.addEventListener('click', async () => {
      dugme.disabled = true; dugme.textContent = METIN[dil].ceviriliyor;
      try {
        const ceviri = await H.cevir(p.metin, p.dil, dil, 700);
        const eksik = H.denetle([{ metin: p.metin, dil: p.dil }], ceviri, dil).filter((x) => !x.startsWith('terim:'));
        kutu.innerHTML = `<div class="metin">${yazi(ceviri)}</div><div class="ceviriNot">${yazi(METIN[dil].kaynakCeviriNot)}</div>` +
          (eksik.length ? `<div class="dur">${yazi(METIN[dil].kaynakSayiUyari(eksik.map((x) => x.replace(/ \?$/, '')).join(', ')))}</div>` : '');
        kutu.dir = SAGDAN.has(dil) ? 'rtl' : 'ltr';
      } catch (e) {
        dugme.disabled = false; dugme.textContent = METIN[dil].kaynakCevir;
      }
    });
    kutu.appendChild(dugme);
    return kutu;
  }

  // ---- konuşma çevirisi (10.11, Özet §96) ----
  // İki panel; her panelin yazıları kendi seçtiği dilde (METIN o dilde yoksa İngilizce). Çeviri TranslateGemma ile
  // (köprü seçimi kapalı olsa da: kullanıcı bu ekranı açtıysa çevirmen istenir). H.konusmaDenetle durdurmaz, uyarır.
  const KONUSMA_DISI = new Set(['nb', 'nn', 'ku', 'az', 'pa', 'zu']);   // ekran çevirisinin de dışında bıraktıkları (07.11)
  let konusmaKuruldu = false, konusmaHazir = false;
  const konusmaMetin = (k) => METIN[k] || METIN.en;
  function konusmaPanel(no, k) {
    const s = document.createElement('section');
    s.className = 'kart kisi'; s.id = 'kisi' + no;
    s.innerHTML = '<div class="kisiUst"><span class="kisiAd"></span><select class="kDil"></select></div>' +
      '<div class="kGelen" aria-live="polite"></div><div class="kGelenUyari dur"></div>' +
      '<button type="button" class="kucukDugme kOku" hidden></button>' +
      '<div class="kisiYaz"><textarea class="kYazi" rows="2" dir="auto" maxlength="600"></textarea><button type="button" class="kCevir"></button></div>' +
      '<div class="kGiden"></div><div class="kGidenUyari dur"></div>';
    const sec = s.querySelector('.kDil');
    const diller = Object.keys(H.DIL_ADI).filter((d) => !KONUSMA_DISI.has(d)).sort((a, b) => dilAdiKisa(a).localeCompare(dilAdiKisa(b)));
    for (const d of diller) { const o = document.createElement('option'); o.value = d; o.textContent = dilAdiKisa(d); sec.appendChild(o); }
    sec.value = diller.includes(k) ? k : 'en';
    sec.addEventListener('change', () => konusmaPanelYaz(s, no));
    return s;
  }
  function konusmaPanelYaz(s, no) {
    const k = s.querySelector('.kDil').value, m = konusmaMetin(k);
    s.lang = k; s.dir = SAGDAN.has(k) ? 'rtl' : 'ltr';
    s.querySelector('.kisiAd').textContent = m.konusmaKisi(no);
    s.querySelector('.kYazi').placeholder = m.konusmaYaz;
    s.querySelector('.kCevir').textContent = m.konusmaCevir;
    s.querySelector('.kOku').textContent = m.konusmaOku;
  }
  // 10.11 (Ercan: "ses kötü olmuş korku filmi gibi"): Mac'te İngilizcede listenin ilk sesi "Albert"ti — şaka seslerinden
  // biri (Bad News, Whisper, Zarvox…; sistem diline göre adı çevrilir: "Kötü Haber", "Org"). Şaka ve eski sesler hiç seçilmez;
  // Eloquence ailesi (Eddy, Grandma…) en sona; bilinen doğal sesler, Premium/Gelişmiş sesler ve sistemin varsayılanı öne.
  // Şaka sesleri yalnız en-US'de: adı başka dile çevrilmiş olsa bile doğal sesler (Samantha, Daniel…) önde kalır.
  const SES_SAKA = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Princess|Agnes|Bruce|Vicki|Kötü Haber|İyi Haber|Org)$/i;
  const SES_ELOQUENCE = /^(Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)( \(|$)/;
  const SES_IYI = /^(Samantha|Daniel|Karen|Moira|Tessa|Rishi|Alex|Ava|Allison|Susan|Tom|Serena|Kate|Oliver|Fiona|Veena)\b|Premium|Enhanced|Gelişmiş|Neural|Natural/i;
  const sesPuan = (v) => (SES_IYI.test(v.name) ? 4 : 0) + (v.default ? 2 : 0) - (SES_ELOQUENCE.test(v.name) ? 5 : 0);
  function sesBul(k) {
    try {
      // yalnız bilgisayarın kendi sesi (internetsiz)
      const sesler = speechSynthesis.getVoices().filter((v) => v.localService && v.lang && !SES_SAKA.test(v.name.trim()));
      const uyan = (o) => sesler.filter((v) => v.lang.toLowerCase().replace('_', '-').startsWith(o));
      const once = uyan(k === 'no' ? 'nb' : k), aday = once.length ? once : uyan(k);
      return aday.sort((a, b) => sesPuan(b) - sesPuan(a))[0] || null;   // eşit puanda listedeki sıra kalır
    } catch (e) { return null; }
  }
  // Sesli okuma tek yerde (10.11): konuşma panelleri ve cevap kutusu aynı ses seçimini kullanır.
  // Okuyan düğmeye yeniden basılırsa susar; başka düğme öncekini keser ve kendi metnini okur.
  // Bu dilde bilgisayarın kendi sesi yoksa false döner (düğme görünmez).
  // 10.11 (Ercan: "tüm ses bilgisayardan dahi olanlar devre dışı bırakalım", §100): sesli okuma KAPALI. Bekçiler yazıyı
  // denetliyor, sesi denetleyen bekçi yok (LM, §99) — okunuş bekçisi kurulana kadar hiçbir ses çıkmaz. Kod yerinde;
  // kapalıyken düğmeler hiç görünmez (basınca bir şey yapmayan düğme kullanıcıyı şaşırtır). Açmak: true.
  const SESLI_OKU = false;
  let okuyanDugme = null;
  function sesliOkuKur(b, metin, k) {
    if (!SESLI_OKU) { b.onclick = null; return false; }
    const ses = typeof speechSynthesis !== 'undefined' && metin ? sesBul(k) : null;
    b.onclick = () => {
      if (!ses) return;
      if (speechSynthesis.speaking && okuyanDugme === b) { speechSynthesis.cancel(); okuyanDugme = null; return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(metin);
      u.voice = ses; u.lang = ses.lang;
      u.onend = () => { if (okuyanDugme === b) okuyanDugme = null; };
      okuyanDugme = b;
      speechSynthesis.speak(u);
    };
    return !!ses;
  }
  // tarayıcı sesleri geç yükler: sayfa açılır açılmaz istenir ki ilk cevapta hazır olsun
  if (SESLI_OKU) try { speechSynthesis.getVoices(); } catch (e) { /* ses yok */ }
  function konusmaOkuHazirla(s, metin, k) {
    const b = s.querySelector('.kOku');
    b.hidden = !sesliOkuKur(b, metin, k);
  }
  async function konusmaCevir(x, y) {
    if (!konusmaHazir) return;
    const kx = x.querySelector('.kDil').value, ky = y.querySelector('.kDil').value;
    const metin = x.querySelector('.kYazi').value.trim();
    if (!metin) return;
    const mx = konusmaMetin(kx), my = konusmaMetin(ky);
    const dugme = x.querySelector('.kCevir');
    dugme.disabled = true; dugme.textContent = mx.ceviriliyor;
    x.querySelector('.kGiden').textContent = ''; x.querySelector('.kGidenUyari').textContent = '';
    try {
      let ceviri = metin, geri = metin;
      if (kx !== ky) {
        ceviri = await H.cevir(metin, kx, ky, 400, CEVIRMEN);
        geri = await H.cevir(ceviri, ky, kx, 400, CEVIRMEN);   // konuşan kendi cümlesinin karşıya nasıl gittiğini görür
      }
      const uyari = kx === ky ? [] : H.konusmaDenetle(metin, kx, ceviri, ky, geri);
      const sayilar = uyari.filter((u) => /^(sayı|gidiş-dönüş):/.test(u)).map((u) => u.replace(/^[^:]+:\s*/, '')).join(', ');
      const g = y.querySelector('.kGelen');
      g.textContent = ceviri; g.lang = ky; g.dir = SAGDAN.has(ky) ? 'rtl' : 'ltr';
      y.querySelector('.kGelenUyari').textContent = uyari.length ? my.konusmaUyari : '';
      const gd = x.querySelector('.kGiden');
      gd.textContent = mx.konusmaGiden(geri); gd.lang = kx;
      x.querySelector('.kGidenUyari').textContent = uyari.length ? mx.konusmaUyari + (sayilar ? ` (${sayilar})` : '') : '';
      konusmaOkuHazirla(y, ceviri, ky);
      x.querySelector('.kYazi').value = '';
    } catch (e) {
      x.querySelector('.kGidenUyari').textContent = mx.hata + e.message;
    } finally {
      dugme.disabled = !konusmaHazir; dugme.textContent = mx.konusmaCevir;
    }
  }
  function konusmaKur() {
    const alan = $('konusmaAlan');
    const a = konusmaPanel(1, dil || 'tr'), b = konusmaPanel(2, dil === 'en' ? 'tr' : 'en');
    alan.append(a, b);
    for (const [x, y, no] of [[a, b, 1], [b, a, 2]]) {
      konusmaPanelYaz(x, no);
      x.querySelector('.kCevir').addEventListener('click', () => konusmaCevir(x, y));
      x.querySelector('.kYazi').addEventListener('keydown', (o) => { if (o.key === 'Enter' && !o.shiftKey) { o.preventDefault(); konusmaCevir(x, y); } });
    }
    $('konusmaYuz').addEventListener('change', () => alan.classList.toggle('yuzYuze', $('konusmaYuz').checked));
    try { speechSynthesis.onvoiceschanged = () => {}; speechSynthesis.getVoices(); } catch (e) { /* ses yok */ }
    konusmaKuruldu = true;
  }
  // 10.11 (Ercan: "hemen hazır olmuyor, hazırlanıyor — yükleme animasyonu koysak"): açılıştaki gibi noktalar oynar,
  // saniye işler; 6 dakikayı geçerse açılışın "uzun sürüyor" notu eklenir. Süre ilk istekten sayılır (ekrana dönünce sıfırlanmaz).
  let konusmaBas = 0, konusmaSayac = null;
  function konusmaDurumYaz() {
    const d = $('konusmaDurum'), m = METIN[dil] || METIN.en;
    const calisiyor = !konusmaHazir && !!konusmaSayac;
    const sn = konusmaBas ? Math.floor((Date.now() - konusmaBas) / 1000) : 0;
    d.className = 'durum' + (calisiyor ? ' calisiyor' : '');
    d.querySelector('.dm').textContent = konusmaHazir ? '' : m.konusmaHazirlaniyor + (sn > 360 ? ' ' + m.acilisUzun : '');
    d.querySelector('.sure').textContent = calisiyor && sn > 0 ? `⏱ ${sn}` : '';
  }
  function konusmaSayacDurdur() {
    if (konusmaSayac) { clearInterval(konusmaSayac); konusmaSayac = null; }
    konusmaDurumYaz();
  }
  function konusmaHazirYaz(h) {
    konusmaHazir = h;
    if (h) { konusmaBas = 0; konusmaSayacDurdur(); } else {
      if (!konusmaBas) konusmaBas = Date.now();
      if (!konusmaSayac) konusmaSayac = setInterval(konusmaDurumYaz, 1000);
      konusmaDurumYaz();
    }
    document.querySelectorAll('#konusmaAlan .kCevir').forEach((b) => { b.disabled = !h; });
  }
  async function konusmaAc() {
    ekranGoster('konusmaEkrani');
    if (!konusmaKuruldu) konusmaKur();
    if (await hazirMi(CEVIRMEN)) { konusmaHazirYaz(true); return; }
    konusmaHazirYaz(false);
    try { await api('cevirmen', { ac: true }); } catch (e) { /* çevirmen açılamadı: durum satırı kalır */ }
    const bas = Date.now();
    const bekle = async () => {
      if (await hazirMi(CEVIRMEN)) { konusmaHazirYaz(true); return; }
      if (Date.now() - bas < 15 * 60 * 1000 && !$('konusmaEkrani').hidden) setTimeout(bekle, 3000);
      else konusmaSayacDurdur();   // bakmayı bıraktık: noktalar da durur, "çalışıyor" gibi görünmesin
    };
    bekle();
  }
  $('konusmaBag').addEventListener('click', (o) => { o.preventDefault(); konusmaAc(); });
  $('konusmaGeri').addEventListener('click', (o) => { o.preventDefault(); ekranGoster('anaEkran'); });
  // bağlantı yalnız çevirmen modeli bu Heybe'de varsa
  fetch(`${API}/cevirmen`, { cache: 'no-store' }).then((r) => r.json()).then((j) => { $('konusmaBag').hidden = !j || j.durum === 'yok'; }).catch(() => {});

  let disKaynaklar = {};   // Kiwix dışı kitaplar (yardımcının durum bilgisinden)
  function kaynaklariGoster(parcalar, adlar) {
    const ol = $('kaynaklar');
    ol.innerHTML = '';
    parcalar.forEach((p, i) => {
      const li = document.createElement('li');
      li.id = `k${i + 1}`;
      const benim = p.kaynak === 'benim';
      const bag = benim ? `/benim/${yolKodla(p.yol)}` : `/kiwix/viewer#${encodeURIComponent(p.kitap)}/${yolKodla(p.yol)}`;
      // başka dildeki kaynak kendi dilinde işaretlenir (06.11: Türkçe sayfada büyük harf "KNIHA"yı "KNİHA" yaptı)
      const kd = p.dil && p.dil !== dil ? (H.KISA[p.dil] || p.dil) : '';
      const dilIs = kd ? ` lang="${yazi(kd)}"` : '';
      const kitapAdi = (benim ? METIN[dil].senin : (adlar[p.kitap] || p.kitap)) +
        (!benim && disKaynaklar[`${p.kitap}.zim`] ? ' · ' + METIN[dil].disKaynakEtiket : '');   // Ercan 07.11: güven etiketi
      const etiket = (kd && !benim ? `<span${dilIs}>${yazi(kitapAdi)}</span>` : yazi(kitapAdi)) +
        (kd ? ' · ' + yazi(METIN[dil].ceviri(dilAdiKisa(p.dil, dil))) : '');   // dil köprüsü
      let ek = '';
      if (benim && p.tur === 'resim') ek = `<img src="${bag}" alt="${yazi(p.makale)}">`;
      if (benim && p.tur === 'video') ek = `<video src="${bag}" controls preload="metadata"></video>`;
      li.innerHTML = `<div class="etiket${benim ? ' benim' : ''}">${etiket}</div>` +
        `<div class="ad"${dilIs}><a href="${bag}" target="_blank">${yazi(p.makale)}</a>${p.bolum ? ' — ' + yazi(p.bolum) : ''}</div>` +
        `<div class="metin"${dilIs}>${yazi(p.metin)}</div>${ek}`;
      if (p.dil && p.dil !== dil && H.AYAR.cevirmen) li.appendChild(kaynakCeviriDugmesi(p));   // 06.11: Ercan'ın isteği
      ol.appendChild(li);
    });
    $('kaynakKart').hidden = parcalar.length === 0;
  }

  // 09.11 (Özet §90): cevabın geldiği bölüm (en çok atıf alan en fazla iki makale) cevabın üstünde. Başka dildeki bölüm
  // adı okuyanın diline çevrilir, özgün adı ayraçta kalır; çevirmen yoksa ya da çeviri boşsa özgün ad.
  let bolumNo = 0;
  async function bolumGoster(r) {
    const el = $('bolumSatir'), no = ++bolumNo;
    const b = (r.bolumler || []).slice(0, 2);
    if (!b.length) { el.hidden = true; return; }
    el.textContent = METIN[dil].bolumKaynak(b.map((x) => x.makale).join(' · '));
    el.hidden = false;
    if (!H.AYAR.cevirmen || !b.some((x) => x.dil && x.dil !== dil)) return;
    const adlar = [];
    for (const x of b) {
      let c = '';
      if (x.dil && x.dil !== dil) {
        try { c = String(await H.cevir(x.makale, x.dil, dil, 40)).split(/\r?\n/)[0].replace(/^["'“”«»\s]+|["'“”«».\s]+$/g, ''); } catch (e) { /* özgün ad kalır */ }
      }
      adlar.push(c && c.toLowerCase() !== x.makale.toLowerCase() ? `${c} (${x.makale})` : x.makale);
    }
    if (no === bolumNo) el.textContent = METIN[dil].bolumKaynak(adlar.join(' · '));
  }

  $('form').addEventListener('submit', async (o) => {
    o.preventDefault();
    const soru = $('soru').value.trim();
    if (!soru) return;
    // ilk soruda kart tek satıra iner (kullanıcı elle açıp kapamadıysa): cevaba yer açılır. Modeller hazır olunca
    // inmez — hızlı bilgisayarda kart birkaç saniyede kaybolurdu (06.11 sınavı).
    if (!acilElle) $('acilAc').open = false;
    $('soru').disabled = true; $('sor').disabled = true;
    $('cevapKart').hidden = true; $('kaynakKart').hidden = true; $('bolumSatir').hidden = true;
    $('cevapOkuYer').hidden = true; try { speechSynthesis.cancel(); } catch (e) { /* ses yok */ }
    sonCevap = null; yanlisSifirla();
    try {
      // dil köprüsü: önce kendi dilinde; bilgi yoksa bellekteki öbür dillerde (çevirmen hazırsa)
      const r = await H.sor(soru, (adim) => durumYaz(adim), dil, H.AYAR.cevirmen ? { yedekDiller: 'hepsi', cevap: 'cevirerek' } : {});
      const adlar = {};
      try { for (const k of await H.kitaplik()) adlar[k.ad] = k.baslik; } catch (e) { /* adlar olmadan da gösterilir */ }
      try { disKaynaklar = (await (await fetch(`${API}/durum`, { cache: 'no-store' })).json()).disKaynak || {}; } catch (e) { /* eski yardımcı */ }
      kaynaklariGoster(r.parcalar, adlar);
      $('cevapKart').hidden = false;
      $('ozgunKutu').hidden = true;
      if (r.ozgun && r.ozgun.guvenli && !r.bilgiYok) {   // özgün cevap kendi kaynağıyla tutuyorsa gösterilir
        $('ozgunBaslik').textContent = METIN[dil].ozgun(dilAdiKisa(r.ozgun.dil, dil));
        $('ozgunMetin').textContent = r.ozgun.cevap;
        $('ozgunKutu').hidden = false;
      }
      if (r.durdur) {
        // her durma sebebi kendi cümlesiyle (06.11 gece: olumsuzluk Ö12, bağlam Ö13)
        const m = METIN[dil], neden = [];
        const sayilar = r.eksik.filter((x) => !/^(terim|olumsuzluk|bağlam|gidiş-dönüş|yön|durum|eylem|yazı|kip|aktarma|çeviride düştü):/.test(x)).map((x) => x.replace(/ \?$/, ''));
        // Ö25 eylem bekçisi (07.11): hangi öneri tehlikeli, okuyanın dilinde (makine çevirisi yoksa İngilizce)
        const eylem = r.eksik.filter((x) => x.startsWith('eylem:')).map((x) => (H.EYLEM.find((k) => `eylem: ${k.ad}` === x) || {}).kod).filter(Boolean);
        const eylemAdi = (k) => ((m.eylemAdlari || {})[k] || METIN.en.eylemAdlari[k]);
        if (eylem.length) neden.push(m.eylemDur(eylem.map(eylemAdi).join('; ')));
        const ceviriSayi = r.eksik.filter((x) => x.startsWith('gidiş-dönüş:')).map((x) => x.replace(/^gidiş-dönüş: | \?$/g, ''));
        const baglam = r.eksik.filter((x) => x.startsWith('bağlam:')).map((x) => x.replace(/^bağlam: | başka (kişi|yer) için$/g, ''));
        if (sayilar.length) neden.push(m.durdur(sayilar.join(', ')));
        if (baglam.length) neden.push(m.baglamDur([...new Set(baglam)].join(', ')));
        if (r.eksik.some((x) => x.startsWith('olumsuzluk:'))) neden.push(m.olumsuzDur);
        if (ceviriSayi.length) neden.push(m.ceviriSayiDur(ceviriSayi.join(', ')));   // Ö20 gidiş-dönüş
        if (r.eksik.some((x) => x.startsWith('yön:'))) neden.push(m.yonDur);         // Ö15
        if (r.eksik.some((x) => x.startsWith('durum:'))) neden.push(m.durumDur);     // Ö22 ikinci göz (07.11)
        if (r.eksik.some((x) => x.startsWith('yazı:'))) neden.push(m.yaziDur);       // Ö27 (09.11)
        if (r.eksik.some((x) => x.startsWith('kip:'))) neden.push(m.kipDur);         // Ö28
        if (r.eksik.some((x) => x.startsWith('aktarma:'))) neden.push(m.aktarmaDur); // Ö29
        const dusen = r.eksik.filter((x) => x.startsWith('çeviride düştü:')).map((x) => x.replace(/^çeviride düştü: /, ''));
        if (dusen.length) neden.push(m.dusenDur(dusen.join(', ')));                  // Ö30
        if (!neden.length) neden.push(m.terimDur);   // yalnız terim: çeviri sorunun konusunu kaybetmiş
        $('cevap').innerHTML = neden.map((x) => `<span class="dur">${yazi(x)}</span>`).join('<br><br>');
      } else if (r.bilgiYok) {
        // modelin sabit "bilmiyorum" cümlesi seçilen dilde gösterilir
        $('cevap').textContent = METIN[dil].bilgiYok + (r.kitapVar ? '' : SATIR + SATIR + METIN[dil].bosDil);
      } else {
        // [1] ve [1, 3] gibi kaynak numaraları kaynak listesine bağlanır
        $('cevap').innerHTML = yazi(r.cevap).replace(/\[([\d,،，、\s]+)\]/g, (t, ic) => '[' +
          ic.split(/\s*[,،，、]\s*/).filter(Boolean).map((n) => `<a href="#k${n}">${n}</a>`).join(', ') + ']');
        bolumGoster(r);
      }
      // ekranda ne yazıyorsa o okunur (durma cümleleri ve "bilmiyorum" dahil); [1, 3] gibi kaynak numaraları okunmaz
      $('cevapOkuYer').hidden = !sesliOkuKur($('cevapOku'), $('cevap').innerText.replace(/\s*\[[\d,،，、\s]+\]/g, '').trim(), dil);
      sonCevap = { soru, dil, r };   // "bu cevap yanlış" bu cevabı kaydeder (Ö18)
      durumYaz('bitti', r.toplam_sn);
    } catch (e) {
      durumYaz('hata', e.message);
    } finally {
      $('soru').disabled = false; $('sor').disabled = false;
    }
  });

  // ---- kitaplık ekranı ----

  function satir(ust, altSatir, dugmeler) {
    const li = document.createElement('li');
    li.innerHTML = `<div class="bilgi"><div class="ust">${ust}</div><div class="alt-satir">${altSatir}</div></div>` +
      `<div class="dugmeler"></div>`;
    for (const d of dugmeler) li.querySelector('.dugmeler').appendChild(d);
    return li;
  }

  function dugme(yazisi, is) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ince'; b.textContent = yazisi;
    b.addEventListener('click', is);
    return b;
  }

  function bag(yazisi, href) {
    const a = document.createElement('a');
    a.href = href; a.target = '_blank'; a.textContent = yazisi;
    return a;
  }

  function dilAdi(kod) {   // Kiwix'in 3 harfli dil kodu → ad (06.11: her dil; tarayıcının kendi dil adları)
    const sabit = { tur: 'Türkçe', eng: 'English', ces: 'Čeština' }[kod];
    if (sabit) return sabit;
    try { return new Intl.DisplayNames([dil || 'en'], { type: 'language' }).of(kod.split(',')[0]) || kod; } catch (e) { return kod; }
  }

  async function kitaplikYenile() {
    acilisDiliKur();
    modelleriYenile();
    const m = METIN[dil];
    try {
      disk = await (await fetch(`${API}/durum`, { cache: 'no-store' })).json();
    } catch (e) {
      $('diskBilgi').textContent = m.hata + e.message;
      return;
    }
    $('diskBilgi').textContent = disk.bos != null ? m.disk(boyutYaz(disk.bos), disk.dosyaSistemi || '') : '';
    $('fatNotu').hidden = disk.buyukDosya !== false;
    const kl = $('kitapListesi');
    kl.innerHTML = '';
    for (const k of disk.kitaplar || []) {
      const ad = k.dosya.replace(/\.zim$/i, '');
      const dis = (disk.disKaynak || {})[k.dosya];
      const disRozet = dis ? `<span class="rozet uyari">${yazi(m.disKaynak + (dis.imzali ? '' : ', ' + m.imzasiz))}</span>` : '';
      const li = satir(yazi(k.baslik) + disRozet, `${yazi(dilAdi(k.dil))} · ${boyutYaz(k.boyut)} · ${yazi(k.dosya)} · <span class="saglik">${yazi(m.saglik.bakiliyor)}</span>`, [
        bag(m.ac, `/kiwix/viewer#${encodeURIComponent(ad)}`),
        dugme(m.kaldir, async () => {
          if (!confirm(m.kaldirSor(k.baslik))) return;
          try { await api('kaldir', { id: k.id }); } catch (e) { alert(m.hata + e.message); }
          kitaplikYenile();
        }),
      ]);
      kl.appendChild(li);
      kitapSagligi(ad).then((d) => {   // Ö17: her kitabın kendi denetimi
        const e = li.querySelector('.saglik');
        e.textContent = m.saglik[d]; e.className = 'saglik ' + (d === 'iyi' ? 'iyi' : 'kotu');
      });
    }
    if (!kl.children.length) kl.innerHTML = `<li class="bos">${yazi(m.kitapYok)}</li>`;
    await benimYenile();
    yanlisYenile();
    indirmeleriYenile();
    listeYukle();
  }

  // ---- Ö17: kitap sağlık denetimi (07.11) ----
  // Doğruluk değil teknik sağlık: kütüphane kitabı açtı mı, tam metin dizini var mı (yoksa Heybe ondan cevap
  // bulamaz), dili tanınıyor mu, rastgele bir sayfası paragraflara ayrılabiliyor mu. Kitap gelince kendiliğinden.
  async function kitapSagligi(ad) {
    let kayit;
    try { kayit = (await H.kitaplik(true)).find((x) => x.ad === ad); } catch (e) { return 'yuklenmedi'; }
    if (!kayit) return 'yuklenmedi';
    if (!kayit.aranir) return 'aranamiyor';
    if (!kayit.dil.split(',').some((u) => H.KISA[u])) return 'dilYok';
    // rastgele en çok üç sayfa: biri bile paragraflara ayrılırsa okunuyor (kısa ya da liste sayfası tek başına yanıltır)
    for (let i = 0; i < 3; i++) {
      try {
        const y = await fetch(`${H.AYAR.kutuphane}/random?content=${encodeURIComponent(ad)}`);
        if (y.ok && H.paragraflar(await y.text()).length) return 'iyi';   // paragraflar yalnız 40 harften uzun metinleri verir
      } catch (e) { /* sıradaki sayfa */ }
    }
    return 'okunamiyor';
  }

  // ---- Ö11: kitap listem (07.11) ----
  // Liste heybe/benim/liste.txt; yardımcı program katalogla karşılaştırır, eksiği indirir, yeni sürümü getirir.
  const HAZIR_LISTE = ['tr_temel', 'ilkyardim_en', 'tip_en', 'cs_zaklad', 'nb_grunnlag', 'bg_osnova'];
  const DIL_LISTESI = { tr: 'tr_temel', cs: 'cs_zaklad', no: 'nb_grunnlag', bg: 'bg_osnova', en: 'ilkyardim_en' };
  const listeKoku = (satir) => (satir.split('#')[0].trim().split(/\s+/)[0] || '').replace(/_\d{4}-\d{2}(\.zim)?$/, '').toLowerCase();
  async function hazirListeMetni(id) {
    return (await (await fetch(`/heybe/listeler/${id}.txt`, { cache: 'no-store' })).text()).trim();
  }
  function listeyeEkle(eski, ek) {
    // hazır listenin satırları eklenir; zaten olan kitap ikinci kez yazılmaz
    const var_ = new Set(eski.split(SATIR).map(listeKoku).filter(Boolean));
    const yeni = ek.split(SATIR).filter((x) => { const k = listeKoku(x); return !k || !var_.has(k); });
    return (eski.trim() ? eski.trim() + SATIR + SATIR : '') + yeni.join(SATIR) + SATIR;
  }
  async function listeYukle() {
    const m = METIN[dil];
    const kutu = $('hazirListeler');
    if (!kutu.children.length) {
      for (const id of HAZIR_LISTE) {
        const b = dugme(m.hazirAd[id] || id, async () => {
          try { $('listeMetin').value = listeyeEkle($('listeMetin').value, await hazirListeMetni(id)); } catch (e) { alert(m.hata + e.message); }
        });
        b.dataset.liste = id;
        kutu.appendChild(b);
      }
    }
    kutu.querySelectorAll('[data-liste]').forEach((b) => { b.textContent = m.hazirAd[b.dataset.liste] || b.dataset.liste; });
    try {
      const l = await (await fetch(`${API}/liste`, { cache: 'no-store' })).json();
      if (document.activeElement !== $('listeMetin')) $('listeMetin').value = l.metin || '';
      $('listeOtomatik').checked = !!l.otomatik;
    } catch (e) { /* eski yardımcı: liste yok */ }
  }
  async function listeKaydet() {
    const m = METIN[dil];
    await api('liste', { metin: $('listeMetin').value, otomatik: $('listeOtomatik').checked });
    $('listeDurumYazi').textContent = m.listeKaydedildi; $('listeDurumYazi').className = 'durum hazir';
  }
  $('listeKaydet').addEventListener('click', () => listeKaydet().catch((e) => alert(METIN[dil].hata + e.message)));
  $('listeOtomatik').addEventListener('change', () => api('liste', { otomatik: $('listeOtomatik').checked }).catch(() => {}));
  async function listeDenetle() {
    const m = METIN[dil];
    const yd = $('listeDurumYazi'), ul = $('listeDurumListesi');
    await listeKaydet();
    yd.textContent = m.listeDenetleniyor; yd.className = 'durum calisiyor';
    ul.innerHTML = ''; $('listeEylem').hidden = true;
    let c;
    try { c = await (await fetch(`${API}/liste-durum`, { cache: 'no-store' })).json(); }
    catch (e) { yd.textContent = m.hata + e.message; yd.className = 'durum kotu'; return; }
    const k = c.kalemler || [];
    if (!k.length) { yd.textContent = m.listeBos; yd.className = 'durum'; return; }
    let eksikN = 0, eksikB = 0, yeniN = 0, yeniB = 0;
    for (const x of k) {
      if (x.durum === 'eksik') { eksikN++; eksikB += x.boyut || 0; }
      if (x.durum === 'yeni') { yeniN++; yeniB += x.boyut || 0; }
      const alt = [m.listeDurum[x.durum] || x.durum, x.boyut ? boyutYaz(x.boyut) : '', x.yeni || x.yerel || '', x.not || ''].filter(Boolean).map(yazi).join(' · ');
      ul.appendChild(satir(yazi(x.baslik || x.kok), alt, []));
    }
    yd.textContent = c.hata ? m.listeDurum.internetYok : (eksikN || yeniN ? '' : m.listeTamam);
    yd.className = c.hata ? 'durum kotu' : 'durum';
    $('listeIndir').hidden = !eksikN; $('listeGuncelle').hidden = !yeniN;
    $('listeIndir').textContent = m.listeIndir(eksikN, boyutYaz(eksikB));
    $('listeGuncelle').textContent = m.listeGuncelle(yeniN, boyutYaz(yeniB));
    $('listeEylem').hidden = !eksikN && !yeniN;
  }
  $('listeDenetle').addEventListener('click', () => listeDenetle().catch((e) => alert(METIN[dil].hata + e.message)));
  async function listeUygula(guncelle) {
    try { await api('liste-uygula', { guncelle }); } catch (e) { alert(METIN[dil].hata + e.message); return; }

  // ---- "bu cevap yanlış" (Ö18, 07.11): kayıt yalnız bu bellekte (heybe/benim/yanlis_cevaplar.jsonl) ----
  // Kayıt soruyu, gösterilen cevabı, kaynak parçalarını ve bekçilerin hükmünü taşır: yeni sürümde aynı soru yeniden
  // sorulup düzelip düzelmediği ölçülür (olcum/kopru/yanlis_oku.cjs). Hiçbir yere kendiliğinden gitmez.
  let sonCevap = null;
  function yanlisSifirla() {
    $('yanlisForm').hidden = true; $('yanlisAc').hidden = false;
    $('yanlisDurum').hidden = true; $('yanlisNot').value = '';
  }
  $('yanlisAc').addEventListener('click', () => { $('yanlisForm').hidden = false; $('yanlisAc').hidden = true; $('yanlisNot').focus(); });

  $('yanlisForm').addEventListener('submit', async (o) => {

    const m = METIN[dil], r = sonCevap.r;
    const kayit = {
      soru: sonCevap.soru, dil: sonCevap.dil, not: $('yanlisNot').value.trim(),
      sonuc: r.durdur ? 'durdu' : r.bilgiYok ? 'bilgiYok' : 'cevap',
      gosterilen: $('cevap').textContent, cevap: r.cevap, eksik: r.eksik || [], basliklar: r.basliklar || [],

      parcalar: (r.parcalar || []).map((p) => ({ kaynak: p.kaynak, kitap: p.kitap, makale: p.makale, bolum: p.bolum,
        yol: p.yol, dil: p.dil, metin: String(p.metin || '').slice(0, 1500) })),
    };
    $('yanlisKaydet').disabled = true;
    try {
      await api('yanlis', { kayit });
      $('yanlisForm').hidden = true;
      $('yanlisDurum').textContent = m.yanlisKaydedildi; $('yanlisDurum').className = 'durum hazir';
      sonCevap = null;   // aynı cevap iki kez kaydolmaz
    } catch (e) {
      $('yanlisDurum').textContent = m.hata + e.message; $('yanlisDurum').className = 'durum kotu';
    } finally {
      $('yanlisDurum').hidden = false; $('yanlisKaydet').disabled = false;
    }
  });

  async function yanlisYenile() {
    const m = METIN[dil], ul = $('yanlisListesi');
    let kayitlar = [];
    try { kayitlar = (await (await fetch(`${API}/yanlis`, { cache: 'no-store' })).json()).kayitlar || []; } catch (e) { /* eski yardımcı */ }
    ul.innerHTML = '';
    for (const k of kayitlar.slice().reverse()) {   // en yenisi başta
      const tarih = k.tarih ? new Date(k.tarih).toLocaleString(dil) : '';
      const alt = [m.yanlisSonuc[k.sonuc] || '', k.not ? `“${k.not}”` : '', tarih].filter(Boolean).map(yazi).join(' · ');
      ul.appendChild(satir(yazi(k.soru), alt, [dugme(m.sil, async () => {
        if (!confirm(m.yanlisSilSor(k.soru))) return;
        try { await api('yanlis', { sil: k.kimlik }); } catch (e) { alert(m.hata + e.message); }
        yanlisYenile();
      })]));
    }
    if (!ul.children.length) ul.innerHTML = `<li class="bos">${yazi(m.yanlisYok)}</li>`;
    $('yanlisIndirSatir').hidden = !kayitlar.length;
  }

  // ---- ilk kurulum: modeller (08.11, Özet §66) ----
  // Yardımcı program eksik modelleri sırayla indirir, sağlamasını denetler ve inen anlam ve sohbet modelini kendisi açar.
  let modelIzle = null, kurulumBasladi = false;
  const MODEL_ADI = { anlam: 'kurulumAnlam', sohbet: 'kurulumSohbet', cevirmen: 'kurulumCevirmen' };
  async function modelleriYenile() {
    clearTimeout(modelIzle);
    const m = METIN[dil] || METIN[ekranDili()] || METIN.en;
    let d;
    try { d = await (await fetch(`${API}/modeller`, { cache: 'no-store' })).json(); } catch (e) { return; }
    const eksik = (d.modeller || []).filter((x) => !x.var);
    acilis.modelEksik = eksik.length > 0;
    $('kurulumNotu').hidden = !acilis.modelEksik;
    $('modelKart').hidden = !acilis.modelEksik && !d.iniyor && !kurulumBasladi;
    if ($('modelKart').hidden) return;
    $('kurulumAciklama').textContent = m.kurulumAciklama(boyutYaz(d.eksikBoyut || 0));
    $('kurulumKosul').innerHTML = `${yazi(m.kurulumKosul)} <a href="${yazi(d.kosullar)}" target="_blank" rel="noopener">${yazi(m.kurulumKosulBag)}</a>`;
    const ml = $('modelListesi');
    ml.innerHTML = '';
    for (const x of d.modeller || []) {
      const yuzde = x.boyut ? Math.floor((100 * x.inen) / x.boyut) : 0;
      let alt = `${boyutYaz(x.boyut)} · ${x.var ? '✓ ' + yazi(m.kurulumHazir) : yazi((x.durum && m.durumlar[x.durum]) || m.kurulumEksik)}`;
      if (!x.var && x.durum === 'iniyor') alt += ` · ${boyutYaz(x.inen)} (%${yuzde})${x.hiz ? ' · ' + boyutYaz(x.hiz) + '/s' : ''}`;
      if (!x.var && x.hata) alt += `<br><span class="dur">${yazi(x.hata)}</span>`;
      const li = satir(yazi(m[MODEL_ADI[x.ne]] || x.dosya), alt, []);
      if (!x.var && x.durum === 'iniyor' && x.boyut) {
        const p = document.createElement('progress');
        p.max = 100; p.value = yuzde;
        li.appendChild(p);
      }
      ml.appendChild(li);
    }
    const b = $('kurulumIndir');
    b.textContent = m.kurulumIndir(boyutYaz(d.eksikBoyut || 0));
    b.hidden = eksik.length === 0;
    b.disabled = !!d.iniyor;
    $('kurulumDurum').textContent = d.iniyor ? m.kurulumIniyor
      : eksik.length === 0 ? (acilisBitti() ? m.acilisHazir : m.kurulumBitti) : $('kurulumDurum').textContent;
    if (d.iniyor) modelIzle = setTimeout(modelleriYenile, 1500);
  }
  $('kurulumIndir').addEventListener('click', async () => {
    const m = METIN[dil] || METIN[ekranDili()] || METIN.en;
    if (!$('kurulumKabul').checked) { $('kurulumDurum').textContent = m.kurulumKabulEt; return; }
    kurulumBasladi = true;
    $('kurulumDurum').textContent = '';
    try { await api('modeller', { kabul: true }); } catch (e) { $('kurulumDurum').textContent = m.hata + e.message; }
    modelleriYenile();
  });
  $('kurulumBag').addEventListener('click', (o) => { o.preventDefault(); ekranGoster('kitaplikEkrani'); kitaplikYenile(); });

  // ---- indirmeler ----

  let izleyici = null;
  const bitenler = new Set();

  async function indirmeleriYenile() {
    clearTimeout(izleyici);
    const m = METIN[dil];
    let liste = [];
    try { liste = await (await fetch(`${API}/indirmeler`, { cache: 'no-store' })).json(); } catch (e) { return; }
    liste = liste.filter((i) => !/\.gguf$/i.test(i.ad));   // modeller kendi kartında (ilk kurulum)
    $('indirmeKart').hidden = liste.length === 0;
    const il = $('indirmeListesi');
    il.innerHTML = '';
    let suruyor = false, yeniBiten = false;
    for (const i of liste) {
      const aktif = ['hazirlaniyor', 'iniyor', 'dogrulaniyor', 'ekleniyor'].includes(i.durum);
      suruyor = suruyor || aktif;
      if (i.durum === 'bitti' && !bitenler.has(i.ad)) { bitenler.add(i.ad); yeniBiten = true; }
      const yuzde = i.boyut ? Math.floor((100 * i.inen) / i.boyut) : 0;
      let alt = `${yazi(m.durumlar[i.durum] || i.durum)}`;
      if (i.boyut) alt += ` · ${boyutYaz(i.inen)} / ${boyutYaz(i.boyut)} (%${yuzde})`;
      if (i.durum === 'iniyor' && i.hiz) alt += ` · ${boyutYaz(i.hiz)}/s`;
      if (i.hata) alt += `<br><span class="dur">${yazi(i.hata)}</span>`;
      const dugmeler = [];
      if (aktif && i.durum === 'iniyor') dugmeler.push(dugme(m.durdurDugme, () => api('iptal', { ad: i.ad }).then(indirmeleriYenile)));
      if (i.durum === 'durdu' || i.durum === 'hata') {
        if (i.meta4) dugmeler.push(dugme(m.devam, () => api('indir', { meta4: i.meta4 }).then(indirmeleriYenile).catch((e) => alert(e.message))));
      }
      if (i.durum === 'durdu' || aktif) {
        dugmeler.push(dugme(m.vazgec, () => { if (confirm(m.vazgecSor)) api('iptal', { ad: i.ad, sil: true }).then(indirmeleriYenile); }));
      }
      const li = satir(yazi(i.ad), alt, dugmeler);
      if (aktif && i.boyut) {
        const p = document.createElement('progress');
        p.max = 100; p.value = yuzde;
        li.appendChild(p);
      }
      il.appendChild(li);
    }
    if (yeniBiten) { kitaplikYenile(); dilNotuGuncelle(); return; }
    if (suruyor) izleyici = setTimeout(indirmeleriYenile, 1500);
  }

  // ---- Kiwix kataloğu ----

  $('katalogForm').addEventListener('submit', async (o) => {
    o.preventDefault();
    const m = METIN[dil];
    const dilKodu = $('katalogDil').value;
    const ara = $('katalogAra').value.trim();
    const kd = $('katalogDurum');
    const kl = $('katalogListesi');
    kd.textContent = m.katalogYukleniyor; kd.className = 'durum';
    kl.innerHTML = '';
    let xml;
    try {
      // katalog çok dilli derlemeleri (TED…) başa koyuyor; tek dilli kitapların hepsi gelsin diye geniş istenir (06.11 ölçüldü)
      const q = new URLSearchParams({ lang: dilKodu, count: '1000' });
      if (ara) q.set('q', ara);
      const yanit = await fetch(`${API}/katalog?${q}`, { cache: 'no-store' });
      if (!yanit.ok) throw new Error(yanit.status);
      xml = new DOMParser().parseFromString(await yanit.text(), 'application/xml');
    } catch (e) {
      kd.textContent = m.katalogYok; kd.className = 'durum kotu';
      return;
    }
    if (!disk) { try { disk = await (await fetch(`${API}/durum`)).json(); } catch (e) { /* olmadan da listelenir */ } }
    const bellekte = new Set((disk && disk.kitaplar || []).map((k) => k.dosya.toLowerCase()));
    const oneri = ONERILEN[dilKodu] || [];
    const al = (e, ad) => (e.getElementsByTagName(ad)[0] || {}).textContent || '';
    const kitaplar = [];
    for (const e of xml.getElementsByTagName('entry')) {
      const diller = al(e, 'language').split(',');
      if (!diller.includes(dilKodu) || (!ara && diller.length > 1)) continue;   // boş aramada çok dilli derlemeler gizli
      let meta4 = '', boyut = 0;
      for (const l of e.getElementsByTagName('link')) {
        if (l.getAttribute('type') === 'application/x-zim') { meta4 = l.getAttribute('href'); boyut = Number(l.getAttribute('length') || 0); }
      }
      if (!meta4) continue;
      const seri = al(e, 'name');
      const aranamaz = /_ftindex:no/.test(al(e, 'tags'));   // Heybe tam metin dizini olmayan kitapta arayamaz (07.11)
      kitaplar.push({ seri, baslik: al(e, 'title'), ozet: al(e, 'summary'), cesit: al(e, 'flavour'), boyut, meta4, aranamaz,
        sira: aranamaz ? 999 : oneri.includes(seri) ? oneri.indexOf(seri) : /^(wikipedia_[a-z]{2,3}_(top|medicine)|wikibooks_[a-z]{2,3}_all|wikiskripta_cs_all|mdwiki_en_all)$/.test(seri) ? 500 : 999 });
    }
    kitaplar.sort((a, b) => a.sira - b.sira || a.baslik.localeCompare(b.baslik, dil) || a.boyut - b.boyut);
    for (const k of kitaplar.slice(0, 80)) {
      const dosya = k.meta4.split('/').pop().replace(/\.meta4$/, '');
      const var_ = bellekte.has(dosya.toLowerCase());
      const buyuk = k.boyut >= 4 * 1024 ** 3 && disk && disk.buyukDosya === false;
      let ust = yazi(k.baslik);
      if (k.sira < 999) ust += `<span class="rozet">${yazi(m.onerilen)}</span>`;   // 500: her dilde genel öneri
      if (var_) ust += `<span class="rozet">${yazi(m.bellekteVar)}</span>`;
      const alt = [m.cesit[k.cesit] || k.cesit, boyutYaz(k.boyut), k.ozet].filter(Boolean).map(yazi).join(' · ') +
        (buyuk ? `<br><span class="dur">${yazi(m.cokBuyuk)}</span>` : '') +
        (k.aranamaz ? `<br><span class="saglik kotu">${yazi(m.saglik.aranamiyor)}</span>` : '');
      const d = dugme(m.indir, async () => {
        d.disabled = true;
        try { await api('indir', { meta4: k.meta4 }); $('indirmeKart').hidden = false; indirmeleriYenile(); }
        catch (e) { alert(m.hata + e.message); d.disabled = false; }
      });
      d.disabled = var_ || buyuk;
      kl.appendChild(satir(ust, alt, [d]));
    }
    kd.textContent = kitaplar.length ? '' : m.sonucYok;
  });

  // ---- bağlantıdan ekle (Ercan 07.11) ----
  $('baglantiForm').addEventListener('submit', async (o) => {
    o.preventDefault();
    const m = METIN[dil], d = $('baglantiDurum');
    const adres = $('baglantiAdres').value.trim();
    let yol = '';
    try { yol = new URL(adres).pathname.toLowerCase(); } catch (e) { d.textContent = m.hata + e.message; d.className = 'durum kotu'; return; }

        if (!y.ok) throw new Error((await y.json().catch(() => ({}))).hata || y.status);
        const ad = decodeURIComponent(y.headers.get('X-Heybe-Dosya') || 'dosya');

        dt.items.add(new File([await y.blob()], ad));
