        $('yukleForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } catch (e) { d.className = 'durum kotu'; d.textContent = m.hata + e.message; }
  });

  // ---- Ö16: dosyanın dilini tanıma (07.11) ----
  // Önce yazı sistemi (Kiril, Arap, Devanagari, Çin…), Latin yazıda en sık kelimeler ve özel harfler. Model gerekmez,
  // internetsiz. Tahmin yalnız öneridir: kullanıcı formda görür, yanlışsa değiştirir.
  const SIK = {
    tr: 've bir bu için ile da de çok ne olarak gibi daha ama değil olan en', en: 'the and of to is in that for with are it this be or',
    cs: 'a je se na že to jako pro by ale jsou jsem není také v z s do který našeho', sk: 'a je sa na že to ako pre by ale sú som nie aj v z s do ktorý nášho',
    de: 'der die und das ist nicht zu ein mit den auf sich von für', fr: 'le la les et des est un une pour que pas dans du sur au',
    es: 'el la de que y en los las del se por un una es con tenemos', it: 'il la di che e è per un una non del della sono con gli',
    pt: 'o a de que e do da em um uma para não os com é', nl: 'de het een en van is dat niet op te zijn met voor er',
    sv: 'och är att det som en på för med inte av till den har ett vi', da: 'og er at det som en på for med ikke af til den har efter vores',
    no: 'og er at det som en på for med ikke av til den har jeg etter vår', fi: 'ja on ei se että oli hän mutta kun ovat tai jos niin jota joka tämä myös',
    pl: 'i w nie się na z że to do jest jak a o co przez', ro: 'și de la în că nu o un cu pe este să din pentru',
    hu: 'a az és hogy nem is egy van meg de ez már csak', hr: 'i je u da se na za ne su od a što kao sa',
    sl: 'in je da se na v za ne so z pa ki tudi', lt: 'ir yra kad į su ne tai iš kaip o bet buvo',
    lv: 'un ir ka ar uz no par kas bet arī nav tas', et: 'ja on ei see et oli ka kui aga mis või meie oma',
    ca: 'el la de i que en els les per amb és del una no tenim', id: 'dan yang di ini itu dengan untuk tidak dari dalam akan pada adalah',
    vi: 'và của là có không được các trong cho một những với người', sw: 'na ya wa kwa ni za katika la hii kama cha au',
    zu: 'ukuthi futhi kanye noma kodwa uma ngoba lapho kakhulu abantu', fil: 'ang ng sa na mga at ay ito para hindi si ko',
    is: 'og að er í á sem ekki það við með til um var',
  };
  const SIK_KUME = Object.fromEntries(Object.entries(SIK).map(([d, k]) => [d, new Set(k.split(' '))]));
  // bir kelime kaç dilin listesinde: ortak kelime ("de", "la") az, tek dile özgü kelime çok sayılır (07.11 ölçümü)
  const KAC_DIL = {};
  for (const k of Object.values(SIK_KUME)) for (const w of k) KAC_DIL[w] = (KAC_DIL[w] || 0) + 1;
  const HARF = { tr: /[şğı]/g, cs: /[řěů]/g, sk: /[ľĺŕô]/g, pl: /[łąęśźżń]/g, ro: /[ășț]/g, hu: /[őű]/g, is: /[þð]/g, vi: /[ơưđạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/g,
    lv: /[āēīūķļņģ]/g, lt: /[ėįųū]/g, et: /[õ]/g, de: /[ß]/g, es: /[ñ¿¡]/g, pt: /[ãõ]/g, da: /[æø]/g, no: /[æø]/g, ca: /l·l/g, fr: /[êèàùç]/g };
  function dilTahmin(metin) {
    const m = (metin || '').slice(0, 20000);
    const say = (re) => (m.match(re) || []).length;
    const yazi_ = [[/\p{Script=Hangul}/gu, 'ko'], [/[\p{Script=Hiragana}\p{Script=Katakana}]/gu, 'ja'], [/\p{Script=Han}/gu, 'zh'],
      [/\p{Script=Thai}/gu, 'th'], [/\p{Script=Hebrew}/gu, 'he'], [/\p{Script=Greek}/gu, 'el'], [/\p{Script=Bengali}/gu, 'bn'],
      [/\p{Script=Gurmukhi}/gu, 'pa'], [/\p{Script=Gujarati}/gu, 'gu'], [/\p{Script=Tamil}/gu, 'ta'], [/\p{Script=Telugu}/gu, 'te'],
      [/\p{Script=Kannada}/gu, 'kn'], [/\p{Script=Malayalam}/gu, 'ml'], [/\p{Script=Devanagari}/gu, 'hi'], [/\p{Script=Arabic}/gu, 'ar'],
      [/\p{Script=Cyrillic}/gu, 'ru']].map(([re, d]) => [say(re), d]);
    const latin = say(/\p{Script=Latin}/gu);
    const [enCok, yd] = yazi_.reduce((a, b) => (b[0] > a[0] ? b : a), [0, '']);
    if (enCok > latin && enCok >= 6) {
      // Japonca: kana varsa (kısa metinde Çince harf sayısı kanayı geçebilir)
      if ((yd === 'ja' || yd === 'zh') && say(/[\p{Script=Hiragana}\p{Script=Katakana}]/gu) >= 2) return 'ja';
      if (yd === 'ru') {   // Kiril: yalnız ayırt edici harfle; hiçbiri yoksa tahmin yok (07.11: kısa Bulgarca "Rusça" sanıldı)
        if (say(/[јђћџљњ]/g)) return 'sr';
        if (say(/[їєґі]/g)) return 'uk';
        if (say(/[ыэё]/g)) return 'ru';
        if (say(/[ъѝ]/g)) return 'bg';
        return null;
      }
      if (yd === 'ar') return say(/[ٹڈڑںے]/g) > 2 ? 'ur' : say(/[پچژگی]/g) > 3 ? 'fa' : 'ar';
      if (yd === 'hi') return /ळ|आहे|च्या|आम्ही|आपण/.test(m) ? 'mr' : 'hi';
      return yd;
    }
    if (latin < 20) return null;
    const kelimeler = m.toLowerCase().match(/\p{L}+/gu) || [];
    const puan = {};
    for (const [d, k] of Object.entries(SIK_KUME)) {
      let n = 0;
      for (const w of kelimeler) if (k.has(w)) n += 1 / KAC_DIL[w];
      puan[d] = n / kelimeler.length + (HARF[d] ? Math.min(say(HARF[d]) / kelimeler.length, 0.2) : 0);
    }
    const sirali = Object.entries(puan).sort((a, b) => b[1] - a[1]);
    return sirali[0][1] > 0.05 && sirali[0][1] > sirali[1][1] * 1.15 ? sirali[0][0] : null;
  }
  async function dilTahminiUygula(metin) {
    const d = dilTahmin(metin), not = $('dilTahminNotu');
    if (!d || ![...$('dosyaDil').options].some((o) => o.value === d)) { not.hidden = true; return; }
    $('dosyaDil').value = d;
    not.textContent = METIN[dil].dilTanindi(dilAdiKisa(d, dil)); not.hidden = false;
  }
  $('dosya').addEventListener('change', async () => {
    const f = $('dosya').files[0];
    $('dilTahminNotu').hidden = true;
    if (!f) return;
    const uz = f.name.split('.').pop().toLowerCase();
    try {
      if (uz === 'txt' || uz === 'md') dilTahminiUygula(await f.slice(0, 40000).text());
      else if (uz === 'pdf') dilTahminiUygula(await pdfMetni(f, () => {}, 3));   // ilk üç sayfa yeter
    } catch (e) { /* tahmin olmazsa kullanıcı seçer */ }
  });
  let aciklamaZaman = null;
  $('dosyaAciklama').addEventListener('input', () => {   // resim ve video: dil açıklamadan
    clearTimeout(aciklamaZaman);
    const f = $('dosya').files[0];
    if (f && ['txt', 'md', 'pdf'].includes(f.name.split('.').pop().toLowerCase())) return;
    aciklamaZaman = setTimeout(() => dilTahminiUygula($('dosyaAciklama').value), 600);
  });

  // ---- kendi dosyası: PDF'in metni tarayıcıda çıkarılır (pdf.js, internetsiz) ----

  async function pdfMetni(dosya, ilerle, enCok = Infinity) {
    const pdfjs = await import('/heybe/pdfjs/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = '/heybe/pdfjs/pdf.worker.min.mjs';
    const belge = await pdfjs.getDocument({ data: new Uint8Array(await dosya.arrayBuffer()),
      cMapUrl: '/heybe/pdfjs/cmaps/', cMapPacked: true, standardFontDataUrl: '/heybe/pdfjs/standard_fonts/' }).promise;
    const sayfalar = [];
    for (let i = 1; i <= Math.min(belge.numPages, enCok); i++) {
      ilerle(i, belge.numPages);
      const icerik = await (await belge.getPage(i)).getTextContent();
      let s = '';
      for (const o of icerik.items) { s += o.str || ''; if (o.hasEOL) s += SATIR; }
      sayfalar.push(s);
    }
    return sayfalar.join(SAYFA);
  }

  $('yukleForm').addEventListener('submit', async (o) => {
    o.preventDefault();
    const m = METIN[dil];
    const yd = $('yukleDurum');
    const dosya = $('dosya').files[0];
    if (!dosya) return;
    const uz = dosya.name.split('.').pop().toLowerCase();
    const gorsel = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'mp4', 'webm', 'm4v', 'mov'].includes(uz);
    if (gorsel && !$('dosyaAciklama').value.trim()) { yd.textContent = m.aciklamaGerekli; yd.className = 'durum kotu'; return; }
    $('ekleDugme').disabled = true;
    yd.className = 'durum';
    try {
      const veri = new FormData();
      veri.append('baslik', $('dosyaBaslik').value.trim());
      veri.append('aciklama', $('dosyaAciklama').value.trim());
      veri.append('dil', $('dosyaDil').value);
      if (uz === 'pdf') veri.append('metin', await pdfMetni(dosya, (s, t) => { yd.textContent = m.pdfOkunuyor(s, t); }));
      veri.append('dosya', dosya);
      const sonuc = await new Promise((tamam, olmadi) => {
        const x = new XMLHttpRequest();
        x.open('POST', `${API}/yukle`);
        x.setRequestHeader('X-Heybe', '1');
        x.upload.onprogress = (e) => { if (e.lengthComputable) yd.textContent = m.yukleniyor(Math.floor((100 * e.loaded) / e.total)); };
        x.onload = () => {
          let v = {};
          try { v = JSON.parse(x.responseText); } catch (e) { /* boş */ }
          if (x.status === 200) tamam(v); else olmadi(new Error(v.hata || x.status));
        };
        x.onerror = () => olmadi(new Error('bağlantı'));
        x.send(veri);
      });
      yd.textContent = m.eklendi(sonuc.paragraf); yd.className = 'durum hazir';
      $('yukleForm').reset(); $('dosyaDil').value = dil; $('dilTahminNotu').hidden = true;
      benimYenile();
    } catch (e) {
      yd.textContent = m.hata + e.message; yd.className = 'durum kotu';
    } finally {
      $('ekleDugme').disabled = false;
    }
  });

  // Dil ekranı her açılışta gelir: bellek sahibinin bilgisayarında açan, Çekçe konuşan bir yardımcı da
  // olabilir (Özet §11). Son seçilen dil yalnız öne çıkarılır.
  dilEkraniGoster();
  ayarOku().then(() => { if (!$('dilEkrani').hidden) dilEkraniGoster(); });   // seçilmiş açılış dili varsa o dilde
  $('acilisDiliSec').addEventListener('change', async () => {
    const m = METIN[dil] || METIN.en, d = $('acilisDiliDurum');
    try {
      const a = await api('ayar', { acilisDili: $('acilisDiliSec').value });
      acilisDili = METIN[a.acilisDili] ? a.acilisDili : '';
      d.className = 'durum hazir'; d.textContent = m.acilisDiliKaydedildi;
    } catch (e) {
      d.className = 'durum kotu'; d.textContent = m.acilisDiliHata;
    }
  });
  acilKartOku();
  bekle();
})();
</script>
