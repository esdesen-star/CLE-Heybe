  // ---- "bu cevap yanlış" (Ö18, 07.11): kayıt yalnız bu bellekte (heybe/benim/yanlis_cevaplar.jsonl) ----
  // Kayıt soruyu, gösterilen cevabı, kaynak parçalarını ve bekçilerin hükmünü taşır: yeni sürümde aynı soru yeniden
  // sorulup düzelip düzelmediği ölçülür (olcum/kopru/yanlis_oku.cjs). Hiçbir yere kendiliğinden gitmez.
  let sonCevap = null;
  function yanlisSifirla() {
    $('yanlisForm').hidden = true; $('yanlisAc').hidden = false;
    $('yanlisDurum').hidden = true; $('yanlisNot').value = '';
  }
  $('yanlisAc').addEventListener('click', () => { $('yanlisForm').hidden = false; $('yanlisAc').hidden = true; $('yanlisNot').focus(); });
  $('yanlisVazgec').addEventListener('click', yanlisSifirla);
  $('yanlisForm').addEventListener('submit', async (o) => {
    o.preventDefault();
    if (!sonCevap) return;
    const m = METIN[dil], r = sonCevap.r;
    const kayit = {
      soru: sonCevap.soru, dil: sonCevap.dil, not: $('yanlisNot').value.trim(),
      sonuc: r.durdur ? 'durdu' : r.bilgiYok ? 'bilgiYok' : 'cevap',
      gosterilen: $('cevap').textContent, cevap: r.cevap, eksik: r.eksik || [], basliklar: r.basliklar || [],
      ozgun: r.ozgun ? { dil: r.ozgun.dil, cevap: r.ozgun.cevap, guvenli: !!r.ozgun.guvenli } : null,
      kopru: !!H.AYAR.cevirmen, sure: r.toplam_sn,
      parcalar: (r.parcalar || []).map((p) => ({ kaynak: p.kaynak, kitap: p.kitap, makale: p.makale, bolum: p.bolum,
        yol: p.yol, dil: p.dil, metin: String(p.metin || '').slice(0, 1500) })),
    };
    // §158 (K7): kayıt yalnız şifreli gider — defter kilitliyse ya da kurulmadıysa önce Defterim (not formda bekler)
    if (!defterAnahtar) {
      const d = $('yanlisDurum');
      d.innerHTML = `${yazi(m.yanlisKilitli)} `; d.className = 'durum'; d.hidden = false;
      if (defterVar) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'kucukDugme'; b.textContent = m.yanlisDefterAc;
        b.addEventListener('click', () => { $('defterAc').open = true; $('defterKart').scrollIntoView({ block: 'start' }); });
        d.appendChild(b);
      }
      return;
    }
    $('yanlisKaydet').disabled = true;
    try {
      await api('yanlis', { kayit: await H.yanlisSifrele({ ...kayit, tarih: new Date().toISOString() }, defterAnahtar) });
      $('yanlisForm').hidden = true;
      $('yanlisDurum').textContent = m.yanlisKaydedildi; $('yanlisDurum').className = 'durum hazir';
      sonCevap = null;   // aynı cevap iki kez kaydolmaz
    } catch (e) {
      $('yanlisDurum').textContent = m.hata + e.message; $('yanlisDurum').className = 'durum kotu';
    } finally {
      $('yanlisDurum').hidden = false; $('yanlisKaydet').disabled = false;
    }
  });

  // §158 (K7): eski (0.38.0'a kadar) şifresiz kayıtlar defter açıkken şifrelenip yerine konur; asıl tarih şifreli içinde kalır
  let yanlisTasiniyor = false;
  async function yanlisTasi() {
    if (!defterAnahtar || yanlisTasiniyor) return false;
    yanlisTasiniyor = true;
    let tasindi = false;
    try {
      const ham = await (await fetch(`${API}/yanlis?indir=1`, { cache: 'no-store' })).text();
      for (const satirMetni of ham.split('\n')) {
        let k; try { k = JSON.parse(satirMetni); } catch (e) { continue; }
        if (!k || k.sifreli || !k.soru || !k.kimlik) continue;
        const { kimlik, surum, yardimci, ...icerik } = k;
        await api('yanlis', { kayit: await H.yanlisSifrele({ ...icerik, eskiSurum: surum || '' }, defterAnahtar) });
        await api('yanlis', { sil: kimlik });
        tasindi = true;
      }
    } catch (e) { /* bir dahaki açılışta yeniden denenir */ }
    yanlisTasiniyor = false;
    return tasindi;
  }
  async function yanlisYenile() {
    const m = METIN[dil], ul = $('yanlisListesi');
    let kayitlar = [];
    try { kayitlar = (await (await fetch(`${API}/yanlis`, { cache: 'no-store' })).json()).kayitlar || []; } catch (e) { /* eski yardımcı */ }
    if (defterAnahtar && kayitlar.some((k) => !k.sifreliOzet && k.soru) && await yanlisTasi()) return yanlisYenile();
    ul.innerHTML = '';
    for (const k of kayitlar.slice().reverse()) {   // en yenisi başta
      let soru = k.soru || '', not = k.not || '', ilkTarih = '';
      if (k.sifreliOzet) {
        soru = m.yanlisSifreli; not = '';
        if (defterAnahtar) { try { ({ soru, not, tarih: ilkTarih = '' } = await H.yanlisCoz(k.sifreliOzet, defterAnahtar)); } catch (e) { /* başka anahtarla yazılmış */ } }
      }
      const tarih = (ilkTarih || k.tarih) ? new Date(ilkTarih || k.tarih).toLocaleString(dil) : '';   // taşınan eski kaydın asıl tarihi
      const alt = [m.yanlisSonuc[k.sonuc] || '', not ? `“${not}”` : '', tarih].filter(Boolean).map(yazi).join(' · ');
      ul.appendChild(satir(yazi(soru), alt, [dugme(m.sil, async () => {
        if (!confirm(m.yanlisSilSor(soru))) return;
        try { await api('yanlis', { sil: k.kimlik }); } catch (e) { alert(m.hata + e.message); }
        yanlisYenile();
      })]));
    }
    if (!ul.children.length) ul.innerHTML = `<li class="bos">${yazi(m.yanlisYok)}</li>`;
    $('yanlisIndirSatir').hidden = !kayitlar.length;
  }
  // indirme: defter açıksa kayıtlar çözülerek iner (kullanıcı geliştirene verebilsin); kilitliyse şifreli hâli
  $('yanlisIndir').addEventListener('click', async (o) => {
    if (!defterAnahtar) return;
    o.preventDefault();
    try {
      const ham = await (await fetch(`${API}/yanlis?indir=1`, { cache: 'no-store' })).text();
      const cikti = [];
      for (const satirMetni of ham.split('\n')) {
        let k; try { k = JSON.parse(satirMetni); } catch (e) { continue; }
        if (k && k.sifreli) { try { const { sifreli, sifreliOzet, ...dis } = k; k = { ...dis, ...(await H.yanlisCoz(sifreli, defterAnahtar)) }; } catch (e) { /* çözülemeyen şifreli kalır */ } }
        cikti.push(JSON.stringify(k));
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([cikti.join('\n') + '\n'], { type: 'application/x-ndjson' }));
      a.download = `heybe_yanlis_cevaplar_${new Date().toISOString().slice(0, 10)}.jsonl`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) { alert(METIN[dil].hata + e.message); }
  });

  // ---- ilk kurulum: modeller (08.11, Özet §66) ----
  // Yardımcı program eksik modelleri sırayla indirir, sağlamasını denetler ve inen anlam ve sohbet modelini kendisi açar.
  let modelIzle = null, kurulumBasladi = false;
  const MODEL_ADI = { anlam: 'kurulumAnlam', sohbet: 'kurulumSohbet', cevirmen: 'kurulumCevirmen' };
  async function modelleriYenile() {
    clearTimeout(modelIzle);
    const m = METIN[dil] || METIN[ekranDili()] || METIN.en;
    let d;
    try { d = await (await fetch(`${API}/modeller`, { cache: 'no-store' })).json(); } catch (e) { return; }
    const eksik = (d.modeller || []).filter((x) => !x.var);
    acilis.modelEksik = eksik.length > 0;
    $('kurulumNotu').hidden = !acilis.modelEksik;
    $('modelKart').hidden = !acilis.modelEksik && !d.iniyor && !kurulumBasladi;
    if ($('modelKart').hidden) return;
    $('kurulumAciklama').textContent = m.kurulumAciklama(boyutYaz(d.eksikBoyut || 0));
    $('kurulumKosul').innerHTML = `${yazi(m.kurulumKosul)} <a href="${yazi(d.kosullar)}" target="_blank" rel="noopener">${yazi(m.kurulumKosulBag)}</a>`;
    const ml = $('modelListesi');
    ml.innerHTML = '';
    for (const x of d.modeller || []) {
      const yuzde = x.boyut ? Math.floor((100 * x.inen) / x.boyut) : 0;
      let alt = `${boyutYaz(x.boyut)} · ${x.var ? '✓ ' + yazi(m.kurulumHazir) : yazi((x.durum && m.durumlar[x.durum]) || m.kurulumEksik)}`;
      if (!x.var && x.durum === 'iniyor') alt += ` · ${boyutYaz(x.inen)} (%${yuzde})${x.hiz ? ' · ' + boyutYaz(x.hiz) + '/s' : ''}`;
      if (!x.var && x.hata) alt += `<br><span class="dur">${yazi(x.hata)}</span>`;
      const li = satir(yazi(m[MODEL_ADI[x.ne]] || x.dosya), alt, []);
      if (!x.var && x.durum === 'iniyor' && x.boyut) {
        const p = document.createElement('progress');
        p.max = 100; p.value = yuzde;
        li.appendChild(p);
      }
      ml.appendChild(li);
    }
    const b = $('kurulumIndir');
    b.textContent = m.kurulumIndir(boyutYaz(d.eksikBoyut || 0));
    b.hidden = eksik.length === 0;
    b.disabled = !!d.iniyor;
    $('kurulumDurum').textContent = d.iniyor ? m.kurulumIniyor
      : eksik.length === 0 ? (acilisBitti() ? m.acilisHazir : m.kurulumBitti) : $('kurulumDurum').textContent;
    if (d.iniyor) modelIzle = setTimeout(modelleriYenile, 1500);
  }
  $('kurulumIndir').addEventListener('click', async () => {
    const m = METIN[dil] || METIN[ekranDili()] || METIN.en;
    if (!$('kurulumKabul').checked) { $('kurulumDurum').textContent = m.kurulumKabulEt; return; }
    kurulumBasladi = true;
    $('kurulumDurum').textContent = '';
    try { await api('modeller', { kabul: true }); } catch (e) { $('kurulumDurum').textContent = m.hata + e.message; }
    modelleriYenile();
  });
  $('kurulumBag').addEventListener('click', (o) => { o.preventDefault(); ekranGoster('kitaplikEkrani'); kitaplikYenile(); });

  // ---- indirmeler ----

  let izleyici = null;
  const bitenler = new Set();

  async function indirmeleriYenile() {
    clearTimeout(izleyici);
    const m = METIN[dil];
    let liste = [];
    try { liste = await (await fetch(`${API}/indirmeler`, { cache: 'no-store' })).json(); } catch (e) { return; }
    liste = liste.filter((i) => !/\.gguf$/i.test(i.ad));   // modeller kendi kartında (ilk kurulum)
    $('indirmeKart').hidden = liste.length === 0;
    const il = $('indirmeListesi');
    il.innerHTML = '';
    let suruyor = false, yeniBiten = false;
    for (const i of liste) {
      const aktif = ['hazirlaniyor', 'iniyor', 'dogrulaniyor', 'ekleniyor'].includes(i.durum);
      suruyor = suruyor || aktif;
      if (i.durum === 'bitti' && !bitenler.has(i.ad)) { bitenler.add(i.ad); yeniBiten = true; }
      const yuzde = i.boyut ? Math.floor((100 * i.inen) / i.boyut) : 0;
      let alt = `${yazi(m.durumlar[i.durum] || i.durum)}`;
      if (i.boyut) alt += ` · ${boyutYaz(i.inen)} / ${boyutYaz(i.boyut)} (%${yuzde})`;
      if (i.durum === 'iniyor' && i.hiz) alt += ` · ${boyutYaz(i.hiz)}/s`;
      if (i.hata) alt += `<br><span class="dur">${yazi(i.hata)}</span>`;
      const dugmeler = [];
      if (aktif && i.durum === 'iniyor') dugmeler.push(dugme(m.durdurDugme, () => api('iptal', { ad: i.ad }).then(indirmeleriYenile)));
      if (i.durum === 'durdu' || i.durum === 'hata') {
        if (i.meta4) dugmeler.push(dugme(m.devam, () => api('indir', { meta4: i.meta4 }).then(indirmeleriYenile).catch((e) => alert(e.message))));
      }
      if (i.durum === 'durdu' || aktif) {
        dugmeler.push(dugme(m.vazgec, () => { if (confirm(m.vazgecSor)) api('iptal', { ad: i.ad, sil: true }).then(indirmeleriYenile); }));
      }
      const li = satir(yazi(i.ad), alt, dugmeler);
      if (aktif && i.boyut) {
        const p = document.createElement('progress');
        p.max = 100; p.value = yuzde;
        li.appendChild(p);
      }
      il.appendChild(li);
    }
    if (yeniBiten) { kitaplikYenile(); dilNotuGuncelle(); return; }
    if (suruyor) izleyici = setTimeout(indirmeleriYenile, 1500);
  }

  // ---- Kiwix kataloğu ----

  $('katalogForm').addEventListener('submit', async (o) => {
    o.preventDefault();
    const m = METIN[dil];
    const dilKodu = $('katalogDil').value;
    const ara = $('katalogAra').value.trim();
    const kd = $('katalogDurum');
    const kl = $('katalogListesi');
    kd.textContent = m.katalogYukleniyor; kd.className = 'durum';
    kl.innerHTML = '';
    let xml;
    try {
      // katalog çok dilli derlemeleri (TED…) başa koyuyor; tek dilli kitapların hepsi gelsin diye geniş istenir (06.11 ölçüldü)
      const q = new URLSearchParams({ lang: dilKodu, count: '1000' });
      if (ara) q.set('q', ara);
      const yanit = await fetch(`${API}/katalog?${q}`, { cache: 'no-store' });
      if (!yanit.ok) throw new Error(yanit.status);
      xml = new DOMParser().parseFromString(await yanit.text(), 'application/xml');
    } catch (e) {
      kd.textContent = m.katalogYok; kd.className = 'durum kotu';
      return;
    }
    if (!disk) { try { disk = await (await fetch(`${API}/durum`)).json(); } catch (e) { /* olmadan da listelenir */ } }
    const bellekte = new Set((disk && disk.kitaplar || []).map((k) => k.dosya.toLowerCase()));
    const oneri = ONERILEN[dilKodu] || [];
    const al = (e, ad) => (e.getElementsByTagName(ad)[0] || {}).textContent || '';
    const kitaplar = [];
    for (const e of xml.getElementsByTagName('entry')) {
      const diller = al(e, 'language').split(',');
      if (!diller.includes(dilKodu) || (!ara && diller.length > 1)) continue;   // boş aramada çok dilli derlemeler gizli
      let meta4 = '', boyut = 0;
      for (const l of e.getElementsByTagName('link')) {
        if (l.getAttribute('type') === 'application/x-zim') { meta4 = l.getAttribute('href'); boyut = Number(l.getAttribute('length') || 0); }
      }
      if (!meta4) continue;
      const seri = al(e, 'name');
      const aranamaz = /_ftindex:no/.test(al(e, 'tags'));   // Heybe tam metin dizini olmayan kitapta arayamaz (07.11)
      kitaplar.push({ seri, baslik: al(e, 'title'), ozet: al(e, 'summary'), cesit: al(e, 'flavour'), boyut, meta4, aranamaz,
        sira: aranamaz ? 999 : oneri.includes(seri) ? oneri.indexOf(seri) : /^(wikipedia_[a-z]{2,3}_(top|medicine)|wikibooks_[a-z]{2,3}_all|wikiskripta_cs_all|mdwiki_en_all)$/.test(seri) ? 500 : 999 });
    }
    kitaplar.sort((a, b) => a.sira - b.sira || a.baslik.localeCompare(b.baslik, dil) || a.boyut - b.boyut);
    for (const k of kitaplar.slice(0, 80)) {
      const dosya = k.meta4.split('/').pop().replace(/\.meta4$/, '');
      const var_ = bellekte.has(dosya.toLowerCase());
      const buyuk = k.boyut >= 4 * 1024 ** 3 && disk && disk.buyukDosya === false;
      let ust = yazi(k.baslik);
      if (k.sira < 999) ust += `<span class="rozet">${yazi(m.onerilen)}</span>`;   // 500: her dilde genel öneri
      if (var_) ust += `<span class="rozet">${yazi(m.bellekteVar)}</span>`;
      if (turAdi(k.seri)) ust += `<span class="rozet${H.kaynakTuru(k.seri) === 'forum' ? ' uyari' : ''}">${yazi(turAdi(k.seri))}</span>`;   // §157
      const alt = [m.cesit[k.cesit] || k.cesit, boyutYaz(k.boyut), k.ozet].filter(Boolean).map(yazi).join(' · ') +
        (buyuk ? `<br><span class="dur">${yazi(m.cokBuyuk)}</span>` : '') +
        (k.aranamaz ? `<br><span class="saglik kotu">${yazi(m.saglik.aranamiyor)}</span>` : '');
      const d = dugme(m.indir, async () => {
        d.disabled = true;
        try { await api('indir', { meta4: k.meta4 }); $('indirmeKart').hidden = false; indirmeleriYenile(); }
        catch (e) { alert(m.hata + e.message); d.disabled = false; }
      });
      d.disabled = var_ || buyuk;
      kl.appendChild(satir(ust, alt, [d]));
    }
    kd.textContent = kitaplar.length ? '' : m.sonucYok;
  });

  // ---- bağlantıdan ekle (Ercan 07.11) ----
  $('baglantiForm').addEventListener('submit', async (o) => {
    o.preventDefault();
    const m = METIN[dil], d = $('baglantiDurum');
    const adres = $('baglantiAdres').value.trim();
    let yol = '';
    try { yol = new URL(adres).pathname.toLowerCase(); } catch (e) { d.textContent = m.hata + e.message; d.className = 'durum kotu'; return; }
    d.className = 'durum calisiyor'; d.textContent = m.baglantiBakiliyor;
    try {
      if (/\.(zim|meta4)$/.test(yol)) {   // kitap: indirmeler listesine girer
        await api('baglanti', { adres });
        d.className = 'durum hazir'; d.textContent = m.baglantiKitap;
        $('indirmeKart').hidden = false; indirmeleriYenile();
      } else {                            // dosya: "Senin dosyaların" formuna gelir
        const y = await fetch(`${API}/baglanti-dosya`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Heybe': '1' }, body: JSON.stringify({ adres }) });
        if (!y.ok) throw new Error((await y.json().catch(() => ({}))).hata || y.status);
        const ad = decodeURIComponent(y.headers.get('X-Heybe-Dosya') || 'dosya');
        const dt = new DataTransfer();
        dt.items.add(new File([await y.blob()], ad));
        $('dosya').files = dt.files;
        $('dosya').dispatchEvent(new Event('change'));
        if (!$('dosyaBaslik').value) $('dosyaBaslik').value = ad.replace(/\.[^.]+$/, '');
        d.className = 'durum hazir'; d.textContent = m.baglantiDosya;
        $('yukleForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } catch (e) { d.className = 'durum kotu'; d.textContent = m.hata + e.message; }
  });

  // ---- Ö16: dosyanın dilini tanıma (07.11) ----
  // Önce yazı sistemi (Kiril, Arap, Devanagari, Çin…), Latin yazıda en sık kelimeler ve özel harfler. Model gerekmez,
  // internetsiz. Tahmin yalnız öneridir: kullanıcı formda görür, yanlışsa değiştirir.
  const SIK = {
    tr: 've bir bu için ile da de çok ne olarak gibi daha ama değil olan en', en: 'the and of to is in that for with are it this be or',
    cs: 'a je se na že to jako pro by ale jsou jsem není také v z s do který našeho', sk: 'a je sa na že to ako pre by ale sú som nie aj v z s do ktorý nášho',
    de: 'der die und das ist nicht zu ein mit den auf sich von für', fr: 'le la les et des est un une pour que pas dans du sur au',
    es: 'el la de que y en los las del se por un una es con tenemos', it: 'il la di che e è per un una non del della sono con gli',
    pt: 'o a de que e do da em um uma para não os com é', nl: 'de het een en van is dat niet op te zijn met voor er',
    sv: 'och är att det som en på för med inte av till den har ett vi', da: 'og er at det som en på for med ikke af til den har efter vores',
    no: 'og er at det som en på for med ikke av til den har jeg etter vår', fi: 'ja on ei se että oli hän mutta kun ovat tai jos niin jota joka tämä myös',
    pl: 'i w nie się na z że to do jest jak a o co przez', ro: 'și de la în că nu o un cu pe este să din pentru',
    hu: 'a az és hogy nem is egy van meg de ez már csak', hr: 'i je u da se na za ne su od a što kao sa',
    sl: 'in je da se na v za ne so z pa ki tudi', lt: 'ir yra kad į su ne tai iš kaip o bet buvo',
    lv: 'un ir ka ar uz no par kas bet arī nav tas', et: 'ja on ei see et oli ka kui aga mis või meie oma',
    ca: 'el la de i que en els les per amb és del una no tenim', id: 'dan yang di ini itu dengan untuk tidak dari dalam akan pada adalah',
    vi: 'và của là có không được các trong cho một những với người', sw: 'na ya wa kwa ni za katika la hii kama cha au',
    zu: 'ukuthi futhi kanye noma kodwa uma ngoba lapho kakhulu abantu', fil: 'ang ng sa na mga at ay ito para hindi si ko',
    is: 'og að er í á sem ekki það við með til um var',
  };
  const SIK_KUME = Object.fromEntries(Object.entries(SIK).map(([d, k]) => [d, new Set(k.split(' '))]));
  // bir kelime kaç dilin listesinde: ortak kelime ("de", "la") az, tek dile özgü kelime çok sayılır (07.11 ölçümü)
  const KAC_DIL = {};
  for (const k of Object.values(SIK_KUME)) for (const w of k) KAC_DIL[w] = (KAC_DIL[w] || 0) + 1;
  const HARF = { tr: /[şğı]/g, cs: /[řěů]/g, sk: /[ľĺŕô]/g, pl: /[łąęśźżń]/g, ro: /[ășț]/g, hu: /[őű]/g, is: /[þð]/g, vi: /[ơưđạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/g,
    lv: /[āēīūķļņģ]/g, lt: /[ėįųū]/g, et: /[õ]/g, de: /[ß]/g, es: /[ñ¿¡]/g, pt: /[ãõ]/g, da: /[æø]/g, no: /[æø]/g, ca: /l·l/g, fr: /[êèàùç]/g };
  function dilTahmin(metin) {
    const m = (metin || '').slice(0, 20000);
    const say = (re) => (m.match(re) || []).length;
    const yazi_ = [[/\p{Script=Hangul}/gu, 'ko'], [/[\p{Script=Hiragana}\p{Script=Katakana}]/gu, 'ja'], [/\p{Script=Han}/gu, 'zh'],
      [/\p{Script=Thai}/gu, 'th'], [/\p{Script=Hebrew}/gu, 'he'], [/\p{Script=Greek}/gu, 'el'], [/\p{Script=Bengali}/gu, 'bn'],
      [/\p{Script=Gurmukhi}/gu, 'pa'], [/\p{Script=Gujarati}/gu, 'gu'], [/\p{Script=Tamil}/gu, 'ta'], [/\p{Script=Telugu}/gu, 'te'],
      [/\p{Script=Kannada}/gu, 'kn'], [/\p{Script=Malayalam}/gu, 'ml'], [/\p{Script=Devanagari}/gu, 'hi'], [/\p{Script=Arabic}/gu, 'ar'],
      [/\p{Script=Cyrillic}/gu, 'ru']].map(([re, d]) => [say(re), d]);
    const latin = say(/\p{Script=Latin}/gu);
    const [enCok, yd] = yazi_.reduce((a, b) => (b[0] > a[0] ? b : a), [0, '']);
    if (enCok > latin && enCok >= 6) {
      // Japonca: kana varsa (kısa metinde Çince harf sayısı kanayı geçebilir)
      if ((yd === 'ja' || yd === 'zh') && say(/[\p{Script=Hiragana}\p{Script=Katakana}]/gu) >= 2) return 'ja';
      if (yd === 'ru') {   // Kiril: yalnız ayırt edici harfle; hiçbiri yoksa tahmin yok (07.11: kısa Bulgarca "Rusça" sanıldı)
        if (say(/[јђћџљњ]/g)) return 'sr';
        if (say(/[їєґі]/g)) return 'uk';
        if (say(/[ыэё]/g)) return 'ru';
        if (say(/[ъѝ]/g)) return 'bg';
        return null;
      }
      if (yd === 'ar') return say(/[ٹڈڑںے]/g) > 2 ? 'ur' : say(/[پچژگی]/g) > 3 ? 'fa' : 'ar';
      if (yd === 'hi') return /ळ|आहे|च्या|आम्ही|आपण/.test(m) ? 'mr' : 'hi';
      return yd;
    }
    if (latin < 20) return null;
    const kelimeler = m.toLowerCase().match(/\p{L}+/gu) || [];
    const puan = {};
    for (const [d, k] of Object.entries(SIK_KUME)) {
      let n = 0;
      for (const w of kelimeler) if (k.has(w)) n += 1 / KAC_DIL[w];
      puan[d] = n / kelimeler.length + (HARF[d] ? Math.min(say(HARF[d]) / kelimeler.length, 0.2) : 0);
    }
    const sirali = Object.entries(puan).sort((a, b) => b[1] - a[1]);
    return sirali[0][1] > 0.05 && sirali[0][1] > sirali[1][1] * 1.15 ? sirali[0][0] : null;
  }
  async function dilTahminiUygula(metin) {
    const d = dilTahmin(metin), not = $('dilTahminNotu');
    if (!d || ![...$('dosyaDil').options].some((o) => o.value === d)) { not.hidden = true; return; }
    $('dosyaDil').value = d;
    not.textContent = METIN[dil].dilTanindi(dilAdiKisa(d, dil)); not.hidden = false;
  }
  $('dosya').addEventListener('change', async () => {
    const f = $('dosya').files[0];
    $('dilTahminNotu').hidden = true;
    if (!f) return;
    const uz = f.name.split('.').pop().toLowerCase();
    try {
      if (uz === 'txt' || uz === 'md') dilTahminiUygula(await f.slice(0, 40000).text());
      else if (uz === 'pdf') dilTahminiUygula(await pdfMetni(f, () => {}, 3));   // ilk üç sayfa yeter
    } catch (e) { /* tahmin olmazsa kullanıcı seçer */ }
  });
  let aciklamaZaman = null;
  $('dosyaAciklama').addEventListener('input', () => {   // resim ve video: dil açıklamadan
    clearTimeout(aciklamaZaman);
    const f = $('dosya').files[0];
    if (f && ['txt', 'md', 'pdf'].includes(f.name.split('.').pop().toLowerCase())) return;
    aciklamaZaman = setTimeout(() => dilTahminiUygula($('dosyaAciklama').value), 600);
  });

  // ---- kendi dosyası: PDF'in metni tarayıcıda çıkarılır (pdf.js, internetsiz) ----

  async function pdfMetni(dosya, ilerle, enCok = Infinity) {
    const pdfjs = await import('/heybe/pdfjs/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = '/heybe/pdfjs/pdf.worker.min.mjs';
    const belge = await pdfjs.getDocument({ data: new Uint8Array(await dosya.arrayBuffer()),
      cMapUrl: '/heybe/pdfjs/cmaps/', cMapPacked: true, standardFontDataUrl: '/heybe/pdfjs/standard_fonts/' }).promise;
    const sayfalar = [];
    for (let i = 1; i <= Math.min(belge.numPages, enCok); i++) {
      ilerle(i, belge.numPages);
      const icerik = await (await belge.getPage(i)).getTextContent();
      let s = '';
      for (const o of icerik.items) { s += o.str || ''; if (o.hasEOL) s += SATIR; }
      sayfalar.push(s);
    }
    return sayfalar.join(SAYFA);
  }

  $('yukleForm').addEventListener('submit', async (o) => {
    o.preventDefault();
    const m = METIN[dil];
    const yd = $('yukleDurum');
    const dosya = $('dosya').files[0];
    if (!dosya) return;
    const uz = dosya.name.split('.').pop().toLowerCase();
    const gorsel = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'mp4', 'webm', 'm4v', 'mov'].includes(uz);
    if (gorsel && !$('dosyaAciklama').value.trim()) { yd.textContent = m.aciklamaGerekli; yd.className = 'durum kotu'; return; }
    $('ekleDugme').disabled = true;
    yd.className = 'durum';
    try {
      const veri = new FormData();
      veri.append('baslik', $('dosyaBaslik').value.trim());
      veri.append('aciklama', $('dosyaAciklama').value.trim());
      veri.append('dil', $('dosyaDil').value);
      if (uz === 'pdf') veri.append('metin', await pdfMetni(dosya, (s, t) => { yd.textContent = m.pdfOkunuyor(s, t); }));
      veri.append('dosya', dosya);
      const sonuc = await new Promise((tamam, olmadi) => {
        const x = new XMLHttpRequest();
        x.open('POST', `${API}/yukle`);
        x.setRequestHeader('X-Heybe', '1');
        x.upload.onprogress = (e) => { if (e.lengthComputable) yd.textContent = m.yukleniyor(Math.floor((100 * e.loaded) / e.total)); };
        x.onload = () => {
          let v = {};
          try { v = JSON.parse(x.responseText); } catch (e) { /* boş */ }
          if (x.status === 200) tamam(v); else olmadi(new Error(v.hata || x.status));
        };
        x.onerror = () => olmadi(new Error('bağlantı'));
        x.send(veri);
      });
      yd.textContent = m.eklendi(sonuc.paragraf); yd.className = 'durum hazir';
      $('yukleForm').reset(); $('dosyaDil').value = dil; $('dilTahminNotu').hidden = true;
      benimYenile();
    } catch (e) {
      yd.textContent = m.hata + e.message; yd.className = 'durum kotu';
    } finally {
      $('ekleDugme').disabled = false;
    }
  });

  // Dil ekranı her açılışta gelir: bellek sahibinin bilgisayarında açan, Çekçe konuşan bir yardımcı da
  // olabilir (Özet §11). Son seçilen dil yalnız öne çıkarılır.
  dilEkraniGoster();
  ayarOku().then(() => { if (!$('dilEkrani').hidden) dilEkraniGoster(); });   // seçilmiş açılış dili varsa o dilde
  $('acilisDiliSec').addEventListener('change', async () => {
    const m = METIN[dil] || METIN.en, d = $('acilisDiliDurum');
    try {
      const a = await api('ayar', { acilisDili: $('acilisDiliSec').value });
      acilisDili = METIN[a.acilisDili] ? a.acilisDili : '';
      d.className = 'durum hazir'; d.textContent = m.acilisDiliKaydedildi;
    } catch (e) {
      d.className = 'durum kotu'; d.textContent = m.acilisDiliHata;
    }
  });
  acilKartOku();
  defterOku();   // §145
  bekle();
})();
</script>
